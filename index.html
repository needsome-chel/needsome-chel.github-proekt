<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR Панорама 360° - Гироскоп | Улица / Комната</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #000;
            touch-action: none;
        }
        
        /* ВЫДВИЖНОЕ МЕНЮ СПРАВА */
        .menu-container {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            pointer-events: none;
        }
        
        .menu-trigger {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 136, 0, 0.7);
            border-right: none;
            border-radius: 30px 0 0 30px;
            padding: 14px 12px 14px 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
            box-shadow: -2px 2px 12px rgba(0,0,0,0.4);
        }
        
        .menu-trigger:active { transform: scale(0.97); background: #ff8800; color: #1e2a3a; }
        .menu-icon { font-size: 22px; }
        .menu-text { font-size: 14px; letter-spacing: 1px; }
        
        .menu-panel {
            pointer-events: auto;
            background: rgba(20, 20, 30, 0.94);
            backdrop-filter: blur(20px);
            border-radius: 24px 0 0 24px;
            border: 1px solid rgba(255, 136, 0, 0.5);
            border-right: none;
            margin-top: 12px;
            padding: 12px 8px 12px 16px;
            width: 190px;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: -4px 4px 20px rgba(0,0,0,0.5);
        }
        
        .menu-panel.open { transform: translateX(0); }
        
        .menu-title {
            color: #ffaa66;
            font-size: 14px;
            font-weight: bold;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 12px;
            text-align: center;
        }
        
        .scene-option {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            margin-bottom: 10px;
            border-radius: 30px;
            color: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .scene-option:hover, .scene-option:active { background: #ff8800; color: #1e2a3a; transform: translateX(-4px); }
        .scene-option.active-opt { background: #ff8800; color: #1e2a3a; box-shadow: 0 0 8px rgba(255,136,0,0.5); }
        .opt-icon { font-size: 20px; }
        
        /* VR панель справа сверху */
        .vr-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 210;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            pointer-events: auto;
        }
        
        .vr-button {
            background: #5a2d8c;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 40px;
            border: none;
            color: white;
            cursor: pointer;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
            transition: 0.2s;
        }
        
        .vr-button:active { transform: scale(0.97); background: #8a4fc9; }
        
        .vr-status {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 500;
            color: #ddd;
            font-family: monospace;
            border-left: 3px solid #ff8800;
        }
        
        /* Подсказки слева вверху */
        .hint-box {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 8px 14px;
            border-radius: 28px;
            color: #f0f0f0;
            font-size: 11px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        /* Адаптация для телефонов */
        @media (max-width: 700px) {
            .menu-panel { width: 170px; padding: 8px 6px 8px 12px; }
            .scene-option { padding: 8px 10px; font-size: 13px; }
            .menu-trigger { padding: 10px 8px 10px 14px; }
            .menu-text { display: none; }
            .menu-icon { font-size: 24px; }
            .hint-box { font-size: 9px; top: 12px; left: 12px; padding: 5px 10px; gap: 6px; }
            .vr-panel { top: 12px; right: 12px; }
            .vr-button { padding: 6px 14px; font-size: 12px; }
            .vr-status { font-size: 9px; padding: 3px 8px; }
        }
        
        .vr-error { background: rgba(200, 60, 50, 0.85); color: white; }
        button { touch-action: manipulation; }
        
        /* Индикатор ориентации (для мобильных) */
        .orientation-toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #ffaa66;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 12px;
            z-index: 300;
            white-space: nowrap;
            pointer-events: none;
            backdrop-filter: blur(4px);
            font-weight: bold;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <!-- ВЫДВИЖНОЕ МЕНЮ -->
    <div class="menu-container">
        <div class="menu-trigger" id="menuTrigger">
            <span class="menu-icon">📁</span>
            <span class="menu-text">Сцены</span>
        </div>
        <div class="menu-panel" id="menuPanel">
            <div class="menu-title">Панорамы 360°</div>
            <button class="scene-option active-opt" data-scene="street">
                <span class="opt-icon">🏙️</span> Улица
            </button>
            <button class="scene-option" data-scene="room">
                <span class="opt-icon">🏠</span> Комната
            </button>
        </div>
    </div>
    
    <!-- VR панель -->
    <div class="vr-panel">
        <button id="customVRBtn" class="vr-button">🥽 VR режим</button>
        <div id="vrSupportStatus" class="vr-status">🕶️ Проверка VR...</div>
    </div>
    
    <!-- Подсказки -->
    <div class="hint-box" id="hintBox">
        <span>🖱️ Мышь / Палец: вращение</span>
        <span>🔍 Жест: приближение</span>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // --- ИНИЦИАЛИЗАЦИЯ ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030318);
        
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 0.1);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // --- Панорамная сфера ---
        const geometry = new THREE.SphereGeometry(500, 64, 64);
        const sphere = new THREE.Mesh(geometry);
        scene.add(sphere);
        
        // Пути к текстурам
        const textures = {
            street: 'img/street.jpg',
            room: 'img/room.jpg'
        };
        
        let currentSceneId = 'street';
        
        function loadPanorama(imagePath) {
            const loader = new THREE.TextureLoader();
            loader.load(imagePath, 
                (texture) => {
                    texture.wrapS = THREE.RepeatWrapping;
                    const material = new THREE.MeshBasicMaterial({
                        map: texture,
                        side: THREE.BackSide
                    });
                    sphere.material = material;
                    console.log('✅ Загружено:', imagePath);
                },
                undefined,
                (error) => {
                    console.error('❌ Ошибка:', imagePath, error);
                    const fallbackMat = new THREE.MeshBasicMaterial({ color: 0xff4488, side: THREE.BackSide });
                    sphere.material = fallbackMat;
                    alert(`Не удалось загрузить ${imagePath}\nПроверьте папку img/`);
                }
            );
        }
        
        loadPanorama(textures.street);
        
        // --- Управление: для мыши/пальца (OrbitControls) и для VR (гироскоп) ---
        // Для обычного режима используем OrbitControls с вращением
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = false;
        controls.enablePan = false;
        controls.rotateSpeed = 1.0;
        controls.target.set(0, 0, 0);
        
        // Настройка зума через FOV (усиленный)
        const MIN_FOV = 14;
        const MAX_FOV = 100;
        camera.fov = 70;
        camera.updateProjectionMatrix();
        
        function handleZoom(deltaY) {
            if (renderer.xr.isPresenting) return;
            let delta = deltaY * 0.08;
            let newFOV = camera.fov + delta;
            newFOV = Math.min(MAX_FOV, Math.max(MIN_FOV, newFOV));
            if (newFOV !== camera.fov) {
                camera.fov = newFOV;
                camera.updateProjectionMatrix();
            }
        }
        
        // Колесико мыши
        window.addEventListener('wheel', (e) => {
            if (!renderer.xr.isPresenting) {
                handleZoom(e.deltaY);
                e.preventDefault();
            }
        }, { passive: false });
        
        // Пинч-зум для телефонов
        let initialPinchDistance = 0;
        let initialFOV = camera.fov;
        
        function getPinchDistance(touches) {
            if (touches.length < 2) return 0;
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }
        
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2 && !renderer.xr.isPresenting) {
                initialPinchDistance = getPinchDistance(e.touches);
                initialFOV = camera.fov;
                e.preventDefault();
            }
        });
        
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDistance > 0 && !renderer.xr.isPresenting) {
                const newDistance = getPinchDistance(e.touches);
                const scale = newDistance / initialPinchDistance;
                let newFOV = initialFOV / scale;
                newFOV = Math.min(MAX_FOV, Math.max(MIN_FOV, newFOV));
                camera.fov = newFOV;
                camera.updateProjectionMatrix();
                e.preventDefault();
            }
        }, { passive: false });
        
        window.addEventListener('touchend', () => { initialPinchDistance = 0; });
        
        // --- ГИРОСКОП ДЛЯ VR НА ТЕЛЕФОНЕ (DeviceOrientation) ---
        // Когда VR режим активен, мы используем показания гироскопа для поворота камеры
        let vrOrientationEnabled = false;
        let currentEuler = new THREE.Euler(0, 0, 0, 'YXZ');
        let finalQuaternion = new THREE.Quaternion();
        
        // Функция для запроса разрешения на гироскоп (iOS 13+ требует разрешения)
        function requestDeviceOrientation() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                // iOS: нужно разрешение от пользователя
                const btn = document.createElement('button');
                btn.textContent = '🔐 Разрешить поворот телефона';
                btn.style.position = 'fixed';
                btn.style.bottom = '30px';
                btn.style.left = '50%';
                btn.style.transform = 'translateX(-50%)';
                btn.style.zIndex = '1000';
                btn.style.padding = '12px 24px';
                btn.style.background = '#ff8800';
                btn.style.border = 'none';
                btn.style.borderRadius = '40px';
                btn.style.fontWeight = 'bold';
                btn.style.color = '#1e2a3a';
                btn.style.cursor = 'pointer';
                btn.style.boxShadow = '0 0 15px rgba(0,0,0,0.5)';
                document.body.appendChild(btn);
                
                btn.addEventListener('click', () => {
                    DeviceOrientationEvent.requestPermission()
                        .then(response => {
                            if (response === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation);
                                btn.remove();
                            }
                        })
                        .catch(console.error);
                });
                return false;
            } else {
                // Android и другие: сразу добавляем слушатель
                window.addEventListener('deviceorientation', handleOrientation);
                return true;
            }
        }
        
        let alpha = 0, beta = 0, gamma = 0;
        
        function handleOrientation(event) {
            if (!vrOrientationEnabled) return;
            // alpha: compass (0-360), beta: front-back (-180..180), gamma: left-right (-90..90)
            alpha = event.alpha || 0;
            beta = event.beta || 0;
            gamma = event.gamma || 0;
            
            // Конвертируем в радианы и применяем к камере
            // Традиционная схема: gamma - поворот влево-вправо (yaw), beta - наклон вверх-вниз (pitch)
            // Для панорамы: вращение по горизонтали (yaw) = -gamma, по вертикали = -beta
            const yaw = (gamma || 0) * Math.PI / 180;
            const pitch = (beta || 0) * Math.PI / 180;
            const roll = (alpha || 0) * Math.PI / 180;
            
            // Создаем кватернион из углов Эйлера (порядок YXZ)
            currentEuler.set(pitch, yaw, roll, 'YXZ');
            finalQuaternion.setFromEuler(currentEuler);
            camera.quaternion.copy(finalQuaternion);
        }
        
        // --- МЕНЮ (выдвижное) ---
        const menuTrigger = document.getElementById('menuTrigger');
        const menuPanel = document.getElementById('menuPanel');
        const sceneOptions = document.querySelectorAll('.scene-option');
        
        function toggleMenu() { menuPanel.classList.toggle('open'); }
        function closeMenu() { menuPanel.classList.remove('open'); }
        
        menuTrigger.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(); });
        document.addEventListener('click', (e) => {
            if (!menuTrigger.contains(e.target) && !menuPanel.contains(e.target)) closeMenu();
        });
        
        sceneOptions.forEach(option => {
            option.addEventListener('click', (e) => {
                const sceneId = option.getAttribute('data-scene');
                if (sceneId === currentSceneId) { closeMenu(); return; }
                sceneOptions.forEach(opt => opt.classList.remove('active-opt'));
                option.classList.add('active-opt');
                
                if (sceneId === 'street') {
                    currentSceneId = 'street';
                    loadPanorama(textures.street);
                } else if (sceneId === 'room') {
                    currentSceneId = 'room';
                    loadPanorama(textures.room);
                }
                if (!renderer.xr.isPresenting) {
                    camera.fov = 70;
                    camera.updateProjectionMatrix();
                }
                closeMenu();
            });
        });
        
        // --- VR ЛОГИКА С ПОДДЕРЖКОЙ ГИРОСКОПА ---
        const customVRBtn = document.getElementById('customVRBtn');
        const vrStatusDiv = document.getElementById('vrSupportStatus');
        
        // Сохраняем ссылку на стандартный контроллер, чтобы временно отключать вращение мышью
        let standardControlsEnabled = true;
        
        function disableOrbitControls(disable) {
            if (disable) {
                controls.enabled = false;
                standardControlsEnabled = false;
            } else {
                controls.enabled = true;
                standardControlsEnabled = true;
            }
        }
        
        async function updateVRStatus() {
            if (!('xr' in navigator)) {
                vrStatusDiv.innerHTML = '❌ VR не поддерживается';
                vrStatusDiv.classList.add('vr-error');
                customVRBtn.disabled = true;
                return false;
            }
            try {
                const supported = await navigator.xr.isSessionSupported('immersive-vr');
                if (supported) {
                    vrStatusDiv.innerHTML = '✅ VR готов (гироскоп)';
                    vrStatusDiv.style.color = '#aaffaa';
                    customVRBtn.disabled = false;
                    return true;
                } else {
                    vrStatusDiv.innerHTML = '📱 VR через гироскоп (Cardboard)';
                    vrStatusDiv.style.color = '#ffaa66';
                    customVRBtn.disabled = false;
                    return false;
                }
            } catch(err) {
                vrStatusDiv.innerHTML = '⚠️ WebXR ошибка';
                vrStatusDiv.classList.add('vr-error');
                customVRBtn.disabled = true;
                return false;
            }
        }
        
        let isVRmodeActive = false;
        
        // Вход в VR-режим с гироскопом (эмуляция Cardboard)
        async function enterVRWithGyro() {
            if (renderer.xr.isPresenting) {
                // Выход из WebXR если был
                const session = renderer.xr.getSession();
                if (session) await session.end();
            }
            
            // Запрашиваем гироскоп (iOS нужно разрешение)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    await DeviceOrientationEvent.requestPermission();
                    window.addEventListener('deviceorientation', handleOrientation);
                } catch(e) {
                    alert('Для VR с поворотом телефона нужно разрешение. Нажмите "Разрешить"');
                    return;
                }
            } else {
                // Убедимся что слушатель активен
                if (!window.hasGyroListener) {
                    window.addEventListener('deviceorientation', handleOrientation);
                    window.hasGyroListener = true;
                }
            }
            
            // Включаем гироскоп-управление
            vrOrientationEnabled = true;
            isVRmodeActive = true;
            
            // Отключаем OrbitControls (вращение мышью/пальцем)
            disableOrbitControls(true);
            
            // Меняем FOV для VR эффекта (чуть шире для погружения)
            camera.fov = 80;
            camera.updateProjectionMatrix();
            
            // Прячем лишние подсказки
            const hintBox = document.getElementById('hintBox');
            if (hintBox) hintBox.style.opacity = '0.3';
            
            vrStatusDiv.innerHTML = '🥽 VR активен | Поворачивай телефон';
            customVRBtn.textContent = '🚪 Выйти из VR';
            
            // Показываем тост с подсказкой
            showToast('🎧 VR режим: поворачивайте телефон для осмотра');
        }
        
        function exitVRWithGyro() {
            vrOrientationEnabled = false;
            isVRmodeActive = false;
            
            // Восстанавливаем управление OrbitControls
            disableOrbitControls(false);
            
            // Восстанавливаем стандартный FOV
            camera.fov = 70;
            camera.updateProjectionMatrix();
            
            // Сбрасываем кватернион камеры, чтобы смотреть прямо
            camera.quaternion.identity();
            camera.rotation.order = 'YXZ';
            
            const hintBox = document.getElementById('hintBox');
            if (hintBox) hintBox.style.opacity = '1';
            
            vrStatusDiv.innerHTML = '✅ VR готов (гироскоп)';
            customVRBtn.textContent = '🥽 VR режим';
            
            showToast('Выход из VR. Управление мышью/пальцем восстановлено');
        }
        
        function showToast(msg) {
            let toast = document.querySelector('.orientation-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.className = 'orientation-toast';
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2500);
        }
        
        // Обработчик кастомной кнопки VR
        customVRBtn.addEventListener('click', async () => {
            if (isVRmodeActive) {
                exitVRWithGyro();
                // Если был активен WebXR, тоже завершаем
                if (renderer.xr.isPresenting) {
                    const session = renderer.xr.getSession();
                    if (session) await session.end();
                }
            } else {
                // Пытаемся войти в VR с гироскопом (это основной метод для телефона без шлема)
                await enterVRWithGyro();
            }
        });
        
        // Обработка реального WebXR (если подключена гарнитура, будет работать параллельно)
        renderer.xr.addEventListener('sessionstart', () => {
            // Если WebXR сессия запущена, отключаем гироскоп, чтобы не конфликтовать
            if (vrOrientationEnabled) exitVRWithGyro();
            vrStatusDiv.innerHTML = '🥽 Гарнитура VR';
            customVRBtn.textContent = '🚪 Выйти из VR';
            disableOrbitControls(true);
        });
        
        renderer.xr.addEventListener('sessionend', () => {
            if (!isVRmodeActive) {
                disableOrbitControls(false);
                vrStatusDiv.innerHTML = '✅ VR готов (гироскоп)';
                customVRBtn.textContent = '🥽 VR режим';
                camera.fov = 70;
                camera.updateProjectionMatrix();
            }
        });
        
        // Запрашиваем статус при старте
        updateVRStatus();
        
        // Автоматически запрашиваем разрешение на гироскоп для Android (без клика, но только если нужно)
        // Для iOS оставляем кнопку разрешения, которая появится при первом нажатии на VR
        if (!(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function')) {
            window.addEventListener('deviceorientation', handleOrientation);
            window.hasGyroListener = true;
        }
        
        // --- Адаптация под resize ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // --- Анимационный цикл ---
        function animate() {
            if (!renderer.xr.isPresenting && !vrOrientationEnabled) {
                // Только если не в VR-гироскопе и не в WebXR, обновляем OrbitControls
                if (controls.enabled) controls.update();
            }
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();
        
        // Подсказка для мобильных устройств
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (isMobile) {
            const hintDiv = document.getElementById('hintBox');
            if (hintDiv) {
                hintDiv.innerHTML = `<span>🖐️ Вращай пальцем</span><span>🤏 Жест: зум</span><span>🥽 Нажми VR для гироскопа</span>`;
            }
