<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR Панорама 360° | Свои фото + Улица / Комната</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #000;
            touch-action: none;
        }
        
        /* ВЫДВИЖНОЕ МЕНЮ СПРАВА */
        .menu-container {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            pointer-events: none;
        }
        
        .menu-trigger {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 136, 0, 0.8);
            border-right: none;
            border-radius: 30px 0 0 30px;
            padding: 14px 12px 14px 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: -2px 2px 12px rgba(0,0,0,0.4);
        }
        
        .menu-trigger:active { transform: scale(0.97); background: #ff8800; color: #1e2a3a; }
        .menu-icon { font-size: 22px; }
        .menu-text { font-size: 14px; letter-spacing: 1px; }
        
        .menu-panel {
            pointer-events: auto;
            background: rgba(20, 20, 30, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px 0 0 24px;
            border: 1px solid rgba(255, 136, 0, 0.5);
            border-right: none;
            margin-top: 12px;
            padding: 12px 8px 12px 16px;
            width: 220px;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: -4px 4px 20px rgba(0,0,0,0.5);
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .menu-panel.open { transform: translateX(0); }
        
        /* Стилизация скролла */
        .menu-panel::-webkit-scrollbar { width: 4px; }
        .menu-panel::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 4px; }
        .menu-panel::-webkit-scrollbar-thumb { background: #ff8800; border-radius: 4px; }
        
        .menu-title {
            color: #ffaa66;
            font-size: 14px;
            font-weight: bold;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 12px;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        /* Кнопка + в кружке */
        .add-photo-btn {
            background: #ff8800;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            color: #1e2a3a;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .add-photo-btn:hover, .add-photo-btn:active {
            transform: scale(1.05);
            background: #ffaa44;
        }
        
        .scene-option {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 30px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            word-break: break-word;
        }
        
        .scene-option:hover, .scene-option:active { background: #ff8800; color: #1e2a3a; transform: translateX(-4px); }
        .scene-option.active-opt { background: #ff8800; color: #1e2a3a; box-shadow: 0 0 8px rgba(255,136,0,0.5); }
        .opt-icon { font-size: 18px; flex-shrink: 0; }
        .opt-name { flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Маленькая кнопка удаления для своих фото */
        .delete-custom {
            background: rgba(255,80,80,0.7);
            border: none;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 11px;
            color: white;
            cursor: pointer;
            margin-left: 6px;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .delete-custom:hover, .delete-custom:active {
            background: #ff3333;
            transform: scale(1.02);
        }
        
        /* Скрытый инпут для загрузки файла */
        #fileInput {
            display: none;
        }
        
        /* VR панель справа сверху */
        .vr-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 210;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            pointer-events: auto;
        }
        
        .vr-button {
            background: #5a2d8c;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 40px;
            border: none;
            color: white;
            cursor: pointer;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
            transition: 0.2s;
        }
        
        .vr-button:active { transform: scale(0.97); background: #8a4fc9; }
        
        .vr-status {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 500;
            color: #ddd;
            font-family: monospace;
            border-left: 3px solid #ff8800;
            max-width: 200px;
            text-align: right;
        }
        
        /* Подсказки слева вверху */
        .hint-box {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            padding: 8px 14px;
            border-radius: 28px;
            color: #f0f0f0;
            font-size: 11px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        /* Подсказка для VR с гироскопом */
        .vr-gyro-hint {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 300;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .vr-gyro-hint div {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            display: inline-block;
            padding: 12px 24px;
            border-radius: 60px;
            color: #ffaa66;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid #ff8800;
        }
        .vr-gyro-hint .arrow-icon {
            font-size: 28px;
            display: inline-block;
            animation: wobble 1.5s infinite ease;
        }
        @keyframes wobble {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(15deg); }
            75% { transform: rotate(-15deg); }
        }
        
        /* Адаптация для телефонов */
        @media (max-width: 700px) {
            .menu-panel { width: 200px; padding: 8px 6px 8px 12px; max-height: 70vh; }
            .scene-option { padding: 8px 10px; font-size: 12px; }
            .menu-trigger { padding: 10px 8px 10px 14px; }
            .menu-text { display: none; }
            .menu-icon { font-size: 24px; }
            .hint-box { font-size: 9px; top: 12px; left: 12px; padding: 5px 10px; gap: 6px; }
            .vr-panel { top: 12px; right: 12px; }
            .vr-button { padding: 6px 14px; font-size: 12px; }
            .vr-status { font-size: 9px; padding: 3px 8px; max-width: 150px; }
            .vr-gyro-hint div { padding: 8px 16px; font-size: 13px; }
        }
        
        .vr-error { background: rgba(200, 60, 50, 0.85); color: white; }
        button { touch-action: manipulation; }
        .hidden { display: none; }
        
        /* Анимация загрузки */
        .loading-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #ffaa66;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            z-index: 400;
            white-space: nowrap;
            backdrop-filter: blur(8px);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ВЫДВИЖНОЕ МЕНЮ СПРАВА -->
    <div class="menu-container">
        <div class="menu-trigger" id="menuTrigger">
            <span class="menu-icon">📁</span>
            <span class="menu-text">Сцены</span>
        </div>
        <div class="menu-panel" id="menuPanel">
            <div class="menu-title">
                <span>Панорамы</span>
                <button id="addPhotoBtn" class="add-photo-btn" title="Загрузить своё панорамное фото">+</button>
            </div>
            <div id="sceneList">
                <!-- Стандартные сцены будут добавлены через JS -->
            </div>
            <div id="customScenesList"></div>
        </div>
    </div>
    
    <!-- Скрытый инпут для загрузки файлов -->
    <input type="file" id="fileInput" accept="image/jpeg,image/jpg,image/png,image/webp">
    
    <!-- VR панель -->
    <div class="vr-panel">
        <button id="customVRBtn" class="vr-button">🥽 VR режим</button>
        <div id="vrSupportStatus" class="vr-status">🕶️ Проверка VR...</div>
    </div>
    
    <!-- Подсказки -->
    <div class="hint-box" id="hintBox">
        <span>🖱️ Мышь: вращение</span>
        <span>🔍 Колесико: приближение</span>
    </div>
    
    <div id="vrGyroHint" class="vr-gyro-hint" style="display: none;">
        <div>
            <span class="arrow-icon">🔄</span> ПОВОРАЧИВАЙ ТЕЛЕФОН <span class="arrow-icon">📱</span><br>
            <span style="font-size: 12px;">наклоняй и крути устройство</span>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // --- ОПРЕДЕЛЕНИЕ МОБИЛЬНОГО УСТРОЙСТВА ---
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const isPhone = isMobile && !/iPad|Android(?!.*Mobile)/i.test(navigator.userAgent);
        
        // --- ИНИЦИАЛИЗАЦИЯ Three.js ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030318);
        
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 0.1);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // --- Панорамная сфера ---
        const geometry = new THREE.SphereGeometry(500, 64, 64);
        const sphere = new THREE.Mesh(geometry);
        scene.add(sphere);
        
        // --- Управление: OrbitControls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = false;
        controls.enablePan = false;
        controls.rotateSpeed = 1.0;
        controls.target.set(0, 0, 0);
        
        // --- Настройка зума через FOV ---
        const MIN_FOV = 14;
        const MAX_FOV = 100;
        camera.fov = 70;
        camera.updateProjectionMatrix();
        
        function handleZoom(deltaY) {
            if (isVRmodeActive) return;
            let delta = deltaY * 0.08;
            let newFOV = camera.fov + delta;
            newFOV = Math.min(MAX_FOV, Math.max(MIN_FOV, newFOV));
            if (newFOV !== camera.fov) {
                camera.fov = newFOV;
                camera.updateProjectionMatrix();
            }
        }
        
        window.addEventListener('wheel', (e) => {
            if (!isVRmodeActive && !renderer.xr.isPresenting) {
                handleZoom(e.deltaY);
                e.preventDefault();
            }
        }, { passive: false });
        
        // Пинч-зум для телефонов
        let initialPinchDistance = 0;
        let initialFOV = camera.fov;
        function getPinchDistance(touches) {
            if (touches.length < 2) return 0;
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }
        
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2 && !isVRmodeActive && !renderer.xr.isPresenting) {
                initialPinchDistance = getPinchDistance(e.touches);
                initialFOV = camera.fov;
                e.preventDefault();
            }
        });
        
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDistance > 0 && !isVRmodeActive && !renderer.xr.isPresenting) {
                const newDistance = getPinchDistance(e.touches);
                const scale = newDistance / initialPinchDistance;
                let newFOV = initialFOV / scale;
                newFOV = Math.min(MAX_FOV, Math.max(MIN_FOV, newFOV));
                camera.fov = newFOV;
                camera.updateProjectionMatrix();
                e.preventDefault();
            }
        }, { passive: false });
        
        window.addEventListener('touchend', () => { initialPinchDistance = 0; });
        
        // --- Управление сценами (стандартные + кастомные) ---
        // Стандартные сцены
        const defaultScenes = [
            { id: 'street', name: '🏙️ Улица', url: 'img/street.jpg', isCustom: false },
            { id: 'room', name: '🏠 Комната', url: 'img/room.jpg', isCustom: false }
        ];
        
        // Хранилище кастомных сцен (сохраняем в localStorage)
        let customScenes = [];
        
        // Загрузка сохранённых кастомных сцен
        function loadCustomScenesFromStorage() {
            const saved = localStorage.getItem('panorama_custom_scenes');
            if (saved) {
                try {
                    customScenes = JSON.parse(saved);
                } catch(e) { customScenes = []; }
            }
            renderSceneList();
        }
        
        // Сохранение кастомных сцен
        function saveCustomScenes() {
            localStorage.setItem('panorama_custom_scenes', JSON.stringify(customScenes));
            renderSceneList();
        }
        
        // Текущая активная сцена
        let currentSceneId = 'street';
        let currentSceneUrl = defaultScenes[0].url;
        
        function loadPanorama(imageUrl, isCustom = false) {
            showToast('Загрузка панорамы...');
            const loader = new THREE.TextureLoader();
            loader.load(imageUrl, 
                (texture) => {
                    texture.wrapS = THREE.RepeatWrapping;
                    const material = new THREE.MeshBasicMaterial({
                        map: texture,
                        side: THREE.BackSide
                    });
                    sphere.material = material;
                    console.log('✅ Загружено:', imageUrl);
                    showToast('Готово!');
                },
                undefined,
                (error) => {
                    console.error('❌ Ошибка:', error);
                    showToast('Ошибка загрузки фото. Убедитесь, что это панорама 360° (соотношение 2:1)');
                    const fallbackMat = new THREE.MeshBasicMaterial({ color: 0xff4488, side: THREE.BackSide });
                    sphere.material = fallbackMat;
                }
            );
        }
        
        function switchToScene(sceneId, sceneUrl, sceneName, isCustom = false) {
            if (currentSceneId === sceneId && !isCustom) return;
            currentSceneId = sceneId;
            currentSceneUrl = sceneUrl;
            loadPanorama(sceneUrl, isCustom);
            
            // Обновляем активный класс в меню
            document.querySelectorAll('.scene-option').forEach(opt => {
                if (opt.getAttribute('data-scene-id') === sceneId) {
                    opt.classList.add('active-opt');
                } else {
                    opt.classList.remove('active-opt');
                }
            });
            
            // Сброс FOV при смене
            if (!isVRmodeActive && !renderer.xr.isPresenting) {
                camera.fov = 70;
                camera.updateProjectionMatrix();
            }
        }
        
        // Добавление кастомной сцены
        function addCustomScene(file) {
            if (!file.type.startsWith('image/')) {
                alert('Пожалуйста, выберите изображение');
                return;
            }
            
            const url = URL.createObjectURL(file);
            const id = 'custom_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            const name = file.name.length > 20 ? file.name.substr(0, 18) + '...' : file.name;
            
            customScenes.push({
                id: id,
                name: '📷 ' + name,
                url: url,
                isCustom: true,
                originalName: file.name
            });
            
            saveCustomScenes();
            
            // Переключаемся на новую сцену
            switchToScene(id, url, name, true);
        }
        
        // Удаление кастомной сцены
        function deleteCustomScene(sceneId) {
            const index = customScenes.findIndex(s => s.id === sceneId);
            if (index !== -1) {
                // Освобождаем URL объект
                if (customScenes[index].url) {
                    URL.revokeObjectURL(customScenes[index].url);
                }
                customScenes.splice(index, 1);
                saveCustomScenes();
                
                // Если удалили активную сцену, переключаемся на улицу
                if (currentSceneId === sceneId) {
                    switchToScene('street', defaultScenes[0].url, defaultScenes[0].name, false);
                }
            }
        }
        
        // Отрисовка списка сцен в меню
        function renderSceneList() {
            const sceneListDiv = document.getElementById('sceneList');
            const customListDiv = document.getElementById('customScenesList');
            
            // Стандартные сцены
            sceneListDiv.innerHTML = '';
            defaultScenes.forEach(scene => {
                const btn = document.createElement('button');
                btn.className = 'scene-option';
                if (currentSceneId === scene.id) btn.classList.add('active-opt');
                btn.setAttribute('data-scene-id', scene.id);
                btn.innerHTML = `<span class="opt-icon">${scene.name.charAt(0)}</span><span class="opt-name">${scene.name}</span>`;
                btn.addEventListener('click', () => {
                    switchToScene(scene.id, scene.url, scene.name, false);
                    closeMenu();
                });
                sceneListDiv.appendChild(btn);
            });
            
            // Кастомные сцены
            customListDiv.innerHTML = '';
            if (customScenes.length > 0) {
                const separator = document.createElement('div');
                separator.style.height = '1px';
                separator.style.background = 'rgba(255,255,255,0.2)';
                separator.style.margin = '8px 0';
                customListDiv.appendChild(separator);
                
                customScenes.forEach(scene => {
                    const btn = document.createElement('button');
                    btn.className = 'scene-option';
                    if (currentSceneId === scene.id) btn.classList.add('active-opt');
                    btn.setAttribute('data-scene-id', scene.id);
                    btn.innerHTML = `
                        <span class="opt-icon">🖼️</span>
                        <span class="opt-name">${scene.name}</span>
                        <button class="delete-custom" data-id="${scene.id}">✖</button>
                    `;
                    btn.addEventListener('click', (e) => {
                        if (e.target.classList.contains('delete-custom')) return;
                        switchToScene(scene.id, scene.url, scene.name, true);
                        closeMenu();
                    });
                    const delBtn = btn.querySelector('.delete-custom');
                    if (delBtn) {
                        delBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            deleteCustomScene(scene.id);
                        });
                    }
                    customListDiv.appendChild(btn);
                });
            }
        }
        
        // --- МЕНЮ (выдвижное) ---
        const menuTrigger = document.getElementById('menuTrigger');
        const menuPanel = document.getElementById('menuPanel');
        
        function toggleMenu() { menuPanel.classList.toggle('open'); }
        function closeMenu() { menuPanel.classList.remove('open'); }
        
        menuTrigger.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(); });
        document.addEventListener('click', (e) => {
            if (!menuTrigger.contains(e.target) && !menuPanel.contains(e.target)) closeMenu();
        });
        
        // --- КНОПКА ДОБАВЛЕНИЯ ФОТО ---
        const addPhotoBtn = document.getElementById('addPhotoBtn');
        const fileInput = document.getElementById('fileInput');
        
        addPhotoBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.click();
        });
        
        fileInput.addEventListener('change', (e) => {
            if (fileInput.files && fileInput.files.length > 0) {
                addCustomScene(fileInput.files[0]);
                fileInput.value = '';
            }
            closeMenu();
        });
        
        // --- ВСПОМОГАТЕЛЬНЫЙ TOAST ---
        function showToast(msg, duration = 2000) {
            let toast = document.querySelector('.loading-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.className = 'loading-toast';
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, duration);
        }
        
        // --- VR ЛОГИКА (гироскоп на телефонах) ---
        let vrOrientationEnabled = false;
        let isVRmodeActive = false;
        let currentEuler = new THREE.Euler(0, 0, 0, 'YXZ');
        let finalQuaternion = new THREE.Quaternion();
        
        function handleOrientation(event) {
            if (!vrOrientationEnabled) return;
            const gamma = event.gamma || 0;
            const beta = event.beta || 0;
            const alpha = event.alpha || 0;
            const yaw = gamma * Math.PI / 180;
            const pitch = beta * Math.PI / 180;
            const roll = alpha * Math.PI / 180;
            currentEuler.set(pitch, yaw, roll, 'YXZ');
            finalQuaternion.setFromEuler(currentEuler);
            camera.quaternion.copy(finalQuaternion);
        }
        
        async function enterVRWithGyro() {
            if (!isPhone) {
                alert('VR с поворотом телефона доступен только на мобильных устройствах');
                return;
            }
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    await DeviceOrientationEvent.requestPermission();
                    window.addEventListener('deviceorientation', handleOrientation);
                } catch(e) {
                    alert('Разрешите доступ к датчикам');
                    return;
                }
            } else {
                if (!window.hasGyroListener) {
                    window.addEventListener('deviceorientation', handleOrientation);
                    window.hasGyroListener = true;
                }
            }
            vrOrientationEnabled = true;
            isVRmodeActive = true;
            controls.enabled = false;
            camera.fov = 75;
            camera.updateProjectionMatrix();
            document.getElementById('vrGyroHint').style.display = 'block';
            vrStatusDiv.innerHTML = '🥁 VR активен | ПОВОРАЧИВАЙ ТЕЛЕФОН';
            customVRBtn.textContent = '🚪 Выйти из VR';
        }
        
        function exitVRWithGyro() {
            vrOrientationEnabled = false;
            isVRmodeActive = false;
            controls.enabled = true;
            camera.fov = 70;
            camera.updateProjectionMatrix();
            camera.quaternion.identity();
            document.getElementById('vrGyroHint').style.display = 'none';
            vrStatusDiv.innerHTML = isPhone ? '📱 Гироскоп готов' : '🖱️ Управление мышью';
            customVRBtn.textContent = '🥽 VR режим';
        }
        
        const customVRBtn = document.getElementById('customVRBtn');
        const vrStatusDiv = document.getElementById('vrSupportStatus');
        
        customVRBtn.addEventListener('click', async () => {
            if (isVRmodeActive) {
                exitVRWithGyro();
                if (renderer.xr.isPresenting) {
                    const session = renderer.xr.getSession();
                    if (session) await session.end();
                }
            } else if (isPhone) {
                await enterVRWithGyro();
            } else if ('xr' in navigator && await navigator.xr.isSessionSupported('immersive-vr')) {
                try {
                    const session = await navigator.xr.requestSession('immersive-vr');
                    await renderer.xr.setSession(session);
                    controls.enabled = false;
                    vrStatusDiv.innerHTML = '🥽 Гарнитура VR';
                    customVRBtn.textContent = '🚪 Выйти из VR';
                    session.addEventListener('end', () => {
                        controls.enabled = true;
                        vrStatusDiv.innerHTML = '🖱️ Управление мышью';
                        customVRBtn.textContent = '🥽 VR режим';
                    });
                } catch(e) { alert('VR не доступен'); }
            } else {
                alert('VR режим доступен на телефонах с гироскопом или с VR-гарнитурой');
            }
        });
        
        renderer.xr.addEventListener('sessionstart', () => {
            if (isVRmodeActive) exitVRWithGyro();
            controls.enabled = false;
        });
        renderer.xr.addEventListener('sessionend', () => {
            if (!isVRmodeActive) controls.enabled = true;
        });
        
        // --- ИНИЦИАЛИЗАЦИЯ ---
        function setupUIHints() {
            const hintBox = document.getElementById('hintBox');
            if (isPhone) {
                hintBox.innerHTML = `<span>🖐️ Вращай пальцем</span><span>🤏 Жест: зум</span><span>🥽 Нажми VR для гироскопа</span>`;
                vrStatusDiv.innerHTML = '📱 Нажми VR → поворачивай телефон';
            } else {
                hintBox.innerHTML = `<span>🖱️ Мышь: вращение</span><span>🔍 Колесико: приближение</span><span>➕ Кнопка + для своего фото</span>`;
                vrStatusDiv.innerHTML = '🖱️ Управление мышью | + загрузить фото';
            }
        }
        
        setupUIHints();
        loadCustomScenesFromStorage();
        
        // Загружаем стартовую панораму
        loadPanorama(defaultScenes[0].url);
        
        // --- АНИМАЦИЯ ---
        function animate() {
            if (!renderer.xr.isPresenting && !vrOrientationEnabled && controls.enabled) {
                controls.update();
            }
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        console.log('✅ Сайт готов: можно загружать свои панорамы через кнопку + в меню');
    </script>
</body>
</html>
