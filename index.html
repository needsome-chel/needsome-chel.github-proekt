<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR Панорама 360° - Поворачивай телефон | Улица / Комната</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #000;
            touch-action: none;
        }
        
        /* ВЫДВИЖНОЕ МЕНЮ СПРАВА */
        .menu-container {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            pointer-events: none;
        }
        
        .menu-trigger {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 136, 0, 0.7);
            border-right: none;
            border-radius: 30px 0 0 30px;
            padding: 14px 12px 14px 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: -2px 2px 12px rgba(0,0,0,0.4);
        }
        
        .menu-trigger:active { transform: scale(0.97); background: #ff8800; color: #1e2a3a; }
        .menu-icon { font-size: 22px; }
        .menu-text { font-size: 14px; letter-spacing: 1px; }
        
        .menu-panel {
            pointer-events: auto;
            background: rgba(20, 20, 30, 0.94);
            backdrop-filter: blur(20px);
            border-radius: 24px 0 0 24px;
            border: 1px solid rgba(255, 136, 0, 0.5);
            border-right: none;
            margin-top: 12px;
            padding: 12px 8px 12px 16px;
            width: 190px;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: -4px 4px 20px rgba(0,0,0,0.5);
        }
        
        .menu-panel.open { transform: translateX(0); }
        
        .menu-title {
            color: #ffaa66;
            font-size: 14px;
            font-weight: bold;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 12px;
            text-align: center;
        }
        
        .scene-option {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            margin-bottom: 10px;
            border-radius: 30px;
            color: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .scene-option:hover, .scene-option:active { background: #ff8800; color: #1e2a3a; transform: translateX(-4px); }
        .scene-option.active-opt { background: #ff8800; color: #1e2a3a; box-shadow: 0 0 8px rgba(255,136,0,0.5); }
        .opt-icon { font-size: 20px; }
        
        /* VR панель справа сверху */
        .vr-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 210;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            pointer-events: auto;
        }
        
        .vr-button {
            background: #5a2d8c;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 40px;
            border: none;
            color: white;
            cursor: pointer;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
            transition: 0.2s;
        }
        
        .vr-button:active { transform: scale(0.97); background: #8a4fc9; }
        
        .vr-status {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 500;
            color: #ddd;
            font-family: monospace;
            border-left: 3px solid #ff8800;
            max-width: 180px;
            text-align: right;
        }
        
        /* Подсказки слева вверху */
        .hint-box {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            padding: 8px 14px;
            border-radius: 28px;
            color: #f0f0f0;
            font-size: 11px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        /* Специальная подсказка для VR режима (показывается только в VR) */
        .vr-gyro-hint {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 300;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        .vr-gyro-hint div {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            display: inline-block;
            padding: 12px 24px;
            border-radius: 60px;
            color: #ffaa66;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid #ff8800;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        
        .vr-gyro-hint .arrow-icon {
            font-size: 28px;
            display: inline-block;
            animation: wobble 1.5s infinite ease;
        }
        
        @keyframes wobble {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(15deg); }
            75% { transform: rotate(-15deg); }
        }
        
        /* Адаптация для телефонов */
        @media (max-width: 700px) {
            .menu-panel { width: 170px; padding: 8px 6px 8px 12px; }
            .scene-option { padding: 8px 10px; font-size: 13px; }
            .menu-trigger { padding: 10px 8px 10px 14px; }
            .menu-text { display: none; }
            .menu-icon { font-size: 24px; }
            .hint-box { font-size: 9px; top: 12px; left: 12px; padding: 5px 10px; gap: 6px; }
            .vr-panel { top: 12px; right: 12px; }
            .vr-button { padding: 6px 14px; font-size: 12px; }
            .vr-status { font-size: 9px; padding: 3px 8px; max-width: 150px; }
            .vr-gyro-hint div { padding: 8px 16px; font-size: 13px; }
            .vr-gyro-hint .arrow-icon { font-size: 22px; }
        }
        
        .vr-error { background: rgba(200, 60, 50, 0.85); color: white; }
        button { touch-action: manipulation; }
        
        /* Скрываем элементы при необходимости */
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- ВЫДВИЖНОЕ МЕНЮ -->
    <div class="menu-container">
        <div class="menu-trigger" id="menuTrigger">
            <span class="menu-icon">📁</span>
            <span class="menu-text">Сцены</span>
        </div>
        <div class="menu-panel" id="menuPanel">
            <div class="menu-title">Панорамы 360°</div>
            <button class="scene-option active-opt" data-scene="street">
                <span class="opt-icon">🏙️</span> Улица
            </button>
            <button class="scene-option" data-scene="room">
                <span class="opt-icon">🏠</span> Комната
            </button>
        </div>
    </div>
    
    <!-- VR панель -->
    <div class="vr-panel">
        <button id="customVRBtn" class="vr-button">🥽 VR режим</button>
        <div id="vrSupportStatus" class="vr-status">🕶️ Проверка VR...</div>
    </div>
    
    <!-- Подсказки (меняются в зависимости от устройства) -->
    <div class="hint-box" id="hintBox">
        <span>🖱️ Мышь: вращение</span>
        <span>🔍 Колесико: приближение</span>
    </div>
    
    <!-- Подсказка для VR с гироскопом (показывается только когда активен VR на телефоне) -->
    <div id="vrGyroHint" class="vr-gyro-hint" style="display: none;">
        <div>
            <span class="arrow-icon">🔄</span> ПОВОРАЧИВАЙ ТЕЛЕФОН <span class="arrow-icon">📱</span><br>
            <span style="font-size: 12px;">наклоняй и крути устройство, чтобы осмотреться</span>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // --- ОПРЕДЕЛЕНИЕ МОБИЛЬНОГО УСТРОЙСТВА (только на телефонах включаем гироскоп) ---
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const isTablet = /iPad|Android(?!.*Mobile)/i.test(navigator.userAgent);
        const isPhone = isMobile && !isTablet; // true на телефонах, false на ПК и планшетах (планшеты тоже не используем гироскоп для удобства)
        
        // Для ПК и планшетов гироскоп НЕ используем, только мышь/палец
        const useGyro = isPhone; // гироскоп ТОЛЬКО на телефонах
        
        console.log('Устройство:', isPhone ? 'Телефон (гироскоп включен)' : 'ПК/Планшет (гироскоп отключен)');
        
        // --- ИНИЦИАЛИЗАЦИЯ Three.js ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030318);
        
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 0.1);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true; // поддерживаем WebXR если есть гарнитура
        document.body.appendChild(renderer.domElement);
        
        // --- Панорамная сфера ---
        const geometry = new THREE.SphereGeometry(500, 64, 64);
        const sphere = new THREE.Mesh(geometry);
        scene.add(sphere);
        
        // Пути к текстурам (img/street.jpg и img/room.jpg)
        const textures = {
            street: 'img/street.jpg',
            room: 'img/room.jpg'
        };
        
        let currentSceneId = 'street';
        
        function loadPanorama(imagePath) {
            const loader = new THREE.TextureLoader();
            loader.load(imagePath, 
                (texture) => {
                    texture.wrapS = THREE.RepeatWrapping;
                    const material = new THREE.MeshBasicMaterial({
                        map: texture,
                        side: THREE.BackSide
                    });
                    sphere.material = material;
                    console.log('✅ Загружено:', imagePath);
                },
                undefined,
                (error) => {
                    console.error('❌ Ошибка:', imagePath, error);
                    const fallbackMat = new THREE.MeshBasicMaterial({ color: 0xff4488, side: THREE.BackSide });
                    sphere.material = fallbackMat;
                    alert(`Не удалось загрузить ${imagePath}\nПроверьте папку img/`);
                }
            );
        }
        
        loadPanorama(textures.street);
        
        // --- Управление: OrbitControls для мыши/пальца (на ПК и телефонах вне VR) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = false;
        controls.enablePan = false;
        controls.rotateSpeed = 1.0;
        controls.target.set(0, 0, 0);
        
        // --- Настройка зума через FOV (усиленный, работает везде) ---
        const MIN_FOV = 14;
        const MAX_FOV = 100;
        camera.fov = 70;
        camera.updateProjectionMatrix();
        
        function handleZoom(deltaY) {
            if (isVRmodeActive) return; // в VR режиме зум отключаем для чистоты
            let delta = deltaY * 0.08;
            let newFOV = camera.fov + delta;
            newFOV = Math.min(MAX_FOV, Math.max(MIN_FOV, newFOV));
            if (newFOV !== camera.fov) {
                camera.fov = newFOV;
                camera.updateProjectionMatrix();
            }
        }
        
        // Колесико мыши (работает на ПК)
        window.addEventListener('wheel', (e) => {
            if (!isVRmodeActive && !renderer.xr.isPresenting) {
                handleZoom(e.deltaY);
                e.preventDefault();
            }
        }, { passive: false });
        
        // Пинч-зум для телефонов (работает всегда, кроме VR)
        let initialPinchDistance = 0;
        let initialFOV = camera.fov;
        
        function getPinchDistance(touches) {
            if (touches.length < 2) return 0;
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }
        
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2 && !isVRmodeActive && !renderer.xr.isPresenting) {
                initialPinchDistance = getPinchDistance(e.touches);
                initialFOV = camera.fov;
                e.preventDefault();
            }
        });
        
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDistance > 0 && !isVRmodeActive && !renderer.xr.isPresenting) {
                const newDistance = getPinchDistance(e.touches);
                const scale = newDistance / initialPinchDistance;
                let newFOV = initialFOV / scale;
                newFOV = Math.min(MAX_FOV, Math.max(MIN_FOV, newFOV));
                camera.fov = newFOV;
                camera.updateProjectionMatrix();
                e.preventDefault();
            }
        }, { passive: false });
        
        window.addEventListener('touchend', () => { initialPinchDistance = 0; });
        
        // --- ГИРОСКОП ТОЛЬКО ДЛЯ ТЕЛЕФОНОВ И ТОЛЬКО В VR РЕЖИМЕ ---
        let vrOrientationEnabled = false;
        let isVRmodeActive = false;
        let currentEuler = new THREE.Euler(0, 0, 0, 'YXZ');
        let finalQuaternion = new THREE.Quaternion();
        
        // Функция обработки ориентации (используется только если useGyro && vrOrientationEnabled)
        function handleOrientation(event) {
            if (!vrOrientationEnabled) return;
            // alpha = compass (0-360), beta = перед-назад (-180..180), gamma = лево-право (-90..90)
            let alpha = event.alpha || 0;
            let beta = event.beta || 0;
            let gamma = event.gamma || 0;
            
            // Преобразуем в радианы и применяем к камере
            // gamma - поворот телефона влево-вправо (Yaw)
            // beta - наклон вверх-вниз (Pitch)
            const yaw = (gamma || 0) * Math.PI / 180;
            const pitch = (beta || 0) * Math.PI / 180;
            const roll = (alpha || 0) * Math.PI / 180;
            
            currentEuler.set(pitch, yaw, roll, 'YXZ');
            finalQuaternion.setFromEuler(currentEuler);
            camera.quaternion.copy(finalQuaternion);
        }
        
        // Функция запроса разрешения на гироскоп (iOS)
        async function requestGyroPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    await DeviceOrientationEvent.requestPermission();
                    window.addEventListener('deviceorientation', handleOrientation);
                    return true;
                } catch (e) {
                    console.warn('Разрешение на гироскоп не получено');
                    return false;
                }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                return true;
            }
        }
        
        // --- Вход и выход из VR режима с гироскопом (ТОЛЬКО НА ТЕЛЕФОНАХ) ---
        async function enterVRWithGyro() {
            if (!useGyro) {
                // На ПК показываем сообщение, что VR с гироскопом только для телефонов
                alert('VR с поворотом телефона доступен только на мобильных устройствах с гироскопом.\nНа ПК используйте мышь для вращения панорамы.');
                return;
            }
            
            // Запрашиваем разрешение для iOS
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                const granted = await requestGyroPermission();
                if (!granted) {
                    alert('Для использования VR с поворотом телефона нужно разрешить доступ к датчикам.');
                    return;
                }
            } else {
                // Android: просто подключаем слушатель если ещё не подключён
                if (!window.hasGyroListener) {
                    window.addEventListener('deviceorientation', handleOrientation);
                    window.hasGyroListener = true;
                }
            }
            
            // Включаем режим гироскопа
            vrOrientationEnabled = true;
            isVRmodeActive = true;
            
            // Отключаем OrbitControls
            controls.enabled = false;
            
            // Настройки камеры для VR
            camera.fov = 75;
            camera.updateProjectionMatrix();
            
            // Показываем крупную подсказку
            const gyroHint = document.getElementById('vrGyroHint');
            if (gyroHint) gyroHint.style.display = 'block';
            
            // Обновляем UI
            vrStatusDiv.innerHTML = '🥁 VR активен | ПОВОРАЧИВАЙ ТЕЛЕФОН';
            vrStatusDiv.style.background = '#5a2d8c';
            customVRBtn.textContent = '🚪 Выйти из VR';
            
            // Изменяем подсказку в левом углу
            const hintBox = document.getElementById('hintBox');
            if (hintBox) {
                hintBox.style.opacity = '0.4';
                hintBox.innerHTML = `<span>🎮 VR режим: поворачивай телефон</span>`;
            }
            
            console.log('VR режим с гироскопом активирован');
        }
        
        function exitVRWithGyro() {
            vrOrientationEnabled = false;
            isVRmodeActive = false;
            
            // Восстанавливаем OrbitControls
            controls.enabled = true;
            
            // Восстанавливаем стандартный FOV
            camera.fov = 70;
            camera.updateProjectionMatrix();
            
            // Сбрасываем поворот камеры
            camera.quaternion.identity();
            camera.rotation.order = 'YXZ';
            
            // Скрываем подсказку
            const gyroHint = document.getElementById('vrGyroHint');
            if (gyroHint) gyroHint.style.display = 'none';
            
            // Восстанавливаем UI
            vrStatusDiv.innerHTML = isPhone ? '✅ VR готов (поверни телефон)' : '✅ VR режим (требуется гарнитура)';
            vrStatusDiv.style.background = '';
            customVRBtn.textContent = '🥽 VR режим';
            
            const hintBox = document.getElementById('hintBox');
            if (hintBox) {
                hintBox.style.opacity = '1';
                if (isPhone) {
                    hintBox.innerHTML = `<span>🖐️ Вращай пальцем</span><span>🤏 Жест: зум</span><span>🥽 Нажми VR для гироскопа</span>`;
                } else {
                    hintBox.innerHTML = `<span>🖱️ Мышь: вращение</span><span>🔍 Колесико: приближение</span>`;
                }
            }
            
            console.log('Выход из VR режима');
        }
        
        // --- Кнопка VR и статус ---
        const customVRBtn = document.getElementById('customVRBtn');
        const vrStatusDiv = document.getElementById('vrSupportStatus');
        
        async function updateVRStatus() {
            if (!('xr' in navigator)) {
                if (isPhone) {
                    vrStatusDiv.innerHTML = '📱 Гироскоп готов | Нажми VR';
                    vrStatusDiv.style.color = '#ffaa66';
                    customVRBtn.disabled = false;
                } else {
                    vrStatusDiv.innerHTML = '💻 VR только для телефонов';
                    vrStatusDiv.classList.add('vr-error');
                    customVRBtn.disabled = false;
                }
                return;
            }
            try {
                const supported = await navigator.xr.isSessionSupported('immersive-vr');
                if (supported && !isPhone) {
                    vrStatusDiv.innerHTML = '🎮 WebXR готов (гарнитура)';
                } else if (isPhone) {
                    vrStatusDiv.innerHTML = '📱 Гироскоп доступен | Нажми VR';
                } else {
                    vrStatusDiv.innerHTML = '🖱️ Управление мышью';
                }
            } catch(err) {
                vrStatusDiv.innerHTML = isPhone ? '📱 Нажми VR для гироскопа' : '🖱️ Мышь + колесико';
            }
        }
        
        // Обработка нажатия на кнопку VR
        customVRBtn.addEventListener('click', async () => {
            if (isVRmodeActive) {
                exitVRWithGyro();
                // Если активен WebXR - тоже выходим
                if (renderer.xr.isPresenting) {
                    const session = renderer.xr.getSession();
                    if (session) await session.end();
                }
            } else {
                // Для телефонов запускаем гироскоп-VR
                if (isPhone) {
                    await enterVRWithGyro();
                } else {
                    // На ПК пытаемся запустить WebXR если есть гарнитура
                    if ('xr' in navigator && await navigator.xr.isSessionSupported('immersive-vr')) {
                        try {
                            const session = await navigator.xr.requestSession('immersive-vr');
                            await renderer.xr.setSession(session);
                            vrStatusDiv.innerHTML = '🥽 Гарнитура VR';
                            customVRBtn.textContent = '🚪 Выйти из VR';
                            controls.enabled = false;
                            session.addEventListener('end', () => {
                                controls.enabled = true;
                                vrStatusDiv.innerHTML = '💻 VR режим (гарнитура)';
                                customVRBtn.textContent = '🥽 VR режим';
                            });
                        } catch(e) {
                            alert('Не удалось войти в VR. Убедитесь, что гарнитура подключена.');
                        }
                    } else {
                        alert('VR с поворотом телефона работает только на мобильных устройствах.\nНа ПК используйте мышь для вращения панорамы.');
                    }
                }
            }
        });
        
        // Обработка WebXR событий
        renderer.xr.addEventListener('sessionstart', () => {
            if (isVRmodeActive) exitVRWithGyro();
            controls.enabled = false;
            vrStatusDiv.innerHTML = '🥽 Гарнитура VR активна';
            customVRBtn.textContent = '🚪 Выйти из VR';
        });
        
        renderer.xr.addEventListener('sessionend', () => {
            if (!isVRmodeActive) {
                controls.enabled = true;
                vrStatusDiv.innerHTML = isPhone ? '📱 Гироскоп готов' : '🖱️ Управление мышью';
                customVRBtn.textContent = '🥽 VR режим';
                camera.fov = 70;
                camera.updateProjectionMatrix();
            }
        });
        
        // --- МЕНЮ (выдвижное, работает на всех устройствах) ---
        const menuTrigger = document.getElementById('menuTrigger');
        const menuPanel = document.getElementById('menuPanel');
        const sceneOptions = document.querySelectorAll('.scene-option');
        
        function toggleMenu() { menuPanel.classList.toggle('open'); }
        function closeMenu() { menuPanel.classList.remove('open'); }
        
        menuTrigger.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(); });
        document.addEventListener('click', (e) => {
            if (!menuTrigger.contains(e.target) && !menuPanel.contains(e.target)) closeMenu();
        });
        
        sceneOptions.forEach(option => {
            option.addEventListener('click', (e) => {
                const sceneId = option.getAttribute('data-scene');
                if (sceneId === currentSceneId) { closeMenu(); return; }
                sceneOptions.forEach(opt => opt.classList.remove('active-opt'));
                option.classList.add('active-opt');
                
                if (sceneId === 'street') {
                    currentSceneId = 'street';
                    loadPanorama(textures.street);
                } else if (sceneId === 'room') {
                    currentSceneId = 'room';
                    loadPanorama(textures.room);
                }
                if (!isVRmodeActive && !renderer.xr.isPresenting) {
                    camera.fov = 70;
                    camera.updateProjectionMatrix();
                }
                closeMenu();
            });
        });
        
        // --- Адаптация под resize ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // --- Настройка текста подсказок в зависимости от устройства ---
        function setupUIHints() {
            const hintBox = document.getElementById('hintBox');
            if (!hintBox) return;
            if (isPhone) {
                hintBox.innerHTML = `<span>🖐️ Вращай пальцем</span><span>🤏 Жест: зум</span><span>🥽 Нажми VR для гироскопа</span>`;
                vrStatusDiv.innerHTML = '📱 Нажми VR → поворачивай телефон';
            } else {
                hintBox.innerHTML = `<span>🖱️ Мышь: вращение</span><span>🔍 Колесико: приближение</span>`;
                vrStatusDiv.innerHTML = '🖱️ Управление мышью | VR для гарнитуры';
            }
        }
        
        setupUIHints();
        updateVRStatus();
        
        // --- Анимационный цикл ---
        function animate() {
            if (!renderer.xr.isPresenting && !vrOrientationEnabled) {
                if (controls.enabled) controls.update();
            }
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();
        
        // Небольшое уведомление для телефонов при старте
        if (isPhone) {
            setTimeout(() => {
                const toast = document.createElement('div');
                toast.textContent = '📱 Нажми «VR режим» и поворачивай телефон!';
                toast.style.position = 'fixed';
                toast.style.bottom = '100px';
                toast.style.left = '50%';
                toast.style.transform = 'translateX(-50%)';
                toast.style.background = '#ff8800';
                toast.style.color = '#1e2a3a';
                toast.style.padding = '8px 16px';
                toast.style.borderRadius = '40px';
                toast.style.fontWeight = 'bold';
                toast.style.zIndex = '300';
                toast.style.fontSize = '12px';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 4000);
            }, 1000);
        }
        
        console.log('✅ Сайт готов: гироскоп ТОЛЬКО на телефонах, понятные подсказки');
    </script>
</body>
</html>
