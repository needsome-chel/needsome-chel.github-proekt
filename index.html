<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Панорама 360° - Улица / Комната</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* Контейнер для кнопок переключения сцен — снизу по центру */
        .scene-buttons {
            position: fixed;
            bottom: 25px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 100;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            width: fit-content;
            margin: 0 auto;
            pointer-events: auto;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        button {
            padding: 10px 28px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #1e2a3a;
            color: white;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        
        button:hover {
            background: #ff8800;
            color: #1e2a3a;
            transform: scale(1.02);
        }
        
        .active {
            background: #ff8800;
            color: #1e2a3a;
            box-shadow: 0 0 12px rgba(255,136,0,0.6);
        }
        
        /* Блок для VR: кнопка и статус, расположены справа сверху */
        .vr-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 110;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            pointer-events: auto;
        }
        
        .vr-button {
            background: #5a2d8c;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 40px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        .vr-button:hover {
            background: #8a4fc9;
            transform: scale(1.02);
        }
        
        .vr-status {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            color: #ffaa66;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
            border-left: 3px solid #ff8800;
            font-family: monospace;
            pointer-events: none;
        }
        
        /* Блок с подсказками: перемещен в левый верхний угол */
        .hint-box {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            padding: 8px 16px;
            border-radius: 24px;
            color: #eee;
            font-size: 13px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.2);
            line-height: 1.4;
        }
        
        .hint-box span {
            display: inline-block;
            margin-right: 12px;
        }
        
        .hint-box i {
            font-style: normal;
            background: rgba(255,136,0,0.3);
            padding: 2px 6px;
            border-radius: 20px;
            margin: 0 2px;
        }
        
        /* Адаптив для мобильных */
        @media (max-width: 650px) {
            button { padding: 6px 16px; font-size: 14px; }
            .vr-button { padding: 6px 14px; font-size: 13px; }
            .hint-box { font-size: 10px; top: 12px; left: 12px; padding: 5px 10px; }
            .vr-status { font-size: 10px; padding: 4px 10px; }
            .scene-buttons { gap: 12px; bottom: 15px; }
        }
        
        /* Стили для сообщения об ошибке VR — теперь сверху справа, совмещено */
        .vr-error {
            background: rgba(220, 50, 50, 0.85);
            color: white;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Кнопки переключения панорам (улица / комната) -->
    <div class="scene-buttons">
        <button id="btnStreet" class="active">🏙️ Улица</button>
        <button id="btnRoom">🏠 Комната</button>
    </div>
    
    <!-- Панель VR: кнопка и статус (вместо старой кнопки внизу) -->
    <div class="vr-panel">
        <button id="customVRBtn" class="vr-button">🥽 Войти в VR</button>
        <div id="vrSupportStatus" class="vr-status">🕶️ Проверка VR...</div>
    </div>
    
    <!-- Подсказки: только вращение мышью + колесико приближения, без "зажми ЛКМ" -->
    <div class="hint-box">
        <span>🖱️ Мышь: вращение</span>
        <span>📌 Колесико: приближение (до 5x)</span>
    </div>

    <!-- Подключаем Three.js и модули -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VRButton } from 'three/addons/webxr/VRButton.js';

        // --- Инициализация сцены, камеры, рендерера ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        
        // Камера с чуть расширенным базовым FOV для лучшего обзора
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 0.1);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // Не добавляем стандартную VR-кнопку Three.js, так как используем кастомную
        // Но чтобы не было конфликтов, создадим свою логику VR
        
        // --- Панорамная сфера ---
        const geometry = new THREE.SphereGeometry(500, 64, 64);
        let sphere = new THREE.Mesh(geometry);
        scene.add(sphere);
        
        // --- Загрузка текстур из папки img ---
        const textures = {
            street: 'img/street.jpg',
            room: 'img/room.jpg'
        };
        
        let activeScene = 'street';
        
        // Функция загрузки панорамы с обработкой ошибок
        function loadPanorama(imagePath) {
            const loader = new THREE.TextureLoader();
            loader.load(imagePath, 
                (texture) => {
                    texture.wrapS = THREE.RepeatWrapping;
                    const material = new THREE.MeshBasicMaterial({
                        map: texture,
                        side: THREE.BackSide
                    });
                    sphere.material = material;
                    console.log('✅ Загружено:', imagePath);
                },
                undefined,
                (error) => {
                    console.error('❌ Ошибка загрузки:', imagePath, error);
                    const fallbackMat = new THREE.MeshBasicMaterial({ color: 0xff5588, side: THREE.BackSide });
                    sphere.material = fallbackMat;
                    alert(`Не удалось загрузить ${imagePath}\nФайл должен лежать в папке img/`);
                }
            );
        }
        
        // Стартовая загрузка
        loadPanorama(textures.street);
        
        // --- Управление с увеличенным зумом (приближение до 5x) ---
        // OrbitControls: вращение + зум (но стандартный зум в Three.js двигает камеру,
        // однако внутри сферы это даст не совсем масштабирование. Реализуем масштабирование через FOV,
        // что даёт эффект "приближения" без выхода из центра. Сделаем зум в 5 раз сильнее.
        
        // Блокируем стандартный зум контролов, чтобы управлять вручную через колесо (увеличение FOV)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = false;      // отключаем встроенный зум, будем использовать FOV
        controls.enablePan = false;
        controls.rotateSpeed = 1.0;
        controls.target.set(0, 0, 0);
        
        // Настройка приближения через поле зрения (FOV)
        // Минимальный FOV = 15 (сильное приближение ~5x от базового 70), максимальный = 100 (широкий угол)
        const MIN_FOV = 14;     // очень сильное приближение (примерно в 5 раз сильнее стандартного 70)
        const MAX_FOV = 100;
        let currentFOV = 70;    // базовое значение
        camera.fov = currentFOV;
        camera.updateProjectionMatrix();
        
        // Обработчик колесика мыши для приближения/отдаления (увеличенный диапазон)
        window.addEventListener('wheel', (e) => {
            if (!renderer.xr.isPresenting) {
                // Регулируем чувствительность: чем меньше шаг, тем плавнее. Дельта * 0.08 даст хороший контроль
                let delta = e.deltaY * 0.08;
                let newFOV = camera.fov + delta;
                // Ограничиваем диапазон (от 14 до 100)
                newFOV = Math.min(MAX_FOV, Math.max(MIN_FOV, newFOV));
                if (newFOV !== camera.fov) {
                    camera.fov = newFOV;
                    camera.updateProjectionMatrix();
                    // Небольшой эффект для отображения уровня зума (опционально)
                    // Можно вывести в консоль, но не засоряем
                }
                e.preventDefault();
            }
        }, { passive: false });
        
        // Также для тачпадов (чтобы зум работал и на ноутбуках без мыши)
        window.addEventListener('touchmove', (e) => {
            // Не мешаем родному скроллу, но при двух пальцах может быть колесико
            if (e.touches.length === 2 && !renderer.xr.isPresenting) {
                // Просто даем колесику сработать, предотвращаем масштабирование страницы
                e.preventDefault();
            }
        }, { passive: false });
        
        // --- Переключение между панорамами ---
        const btnStreet = document.getElementById('btnStreet');
        const btnRoom = document.getElementById('btnRoom');
        
        function setActiveButton(active) {
            if (active === 'street') {
                btnStreet.classList.add('active');
                btnRoom.classList.remove('active');
            } else {
                btnRoom.classList.add('active');
                btnStreet.classList.remove('active');
            }
        }
        
        btnStreet.addEventListener('click', () => {
            if (activeScene === 'street') return;
            activeScene = 'street';
            setActiveButton('street');
            loadPanorama(textures.street);
        });
        
        btnRoom.addEventListener('click', () => {
            if (activeScene === 'room') return;
            activeScene = 'room';
            setActiveButton('room');
            loadPanorama(textures.room);
        });
        
        // --- КАСТОМНАЯ VR-ЛОГИКА с проверкой поддержки и отображением статуса (надпись сверху справа вместо нижней) ---
        const customVRBtn = document.getElementById('customVRBtn');
        const vrStatusDiv = document.getElementById('vrSupportStatus');
        
        // Функция обновления статуса VR
        async function updateVRStatus() {
            if (!('xr' in navigator)) {
                vrStatusDiv.innerHTML = '❌ VR не поддерживается браузером';
                vrStatusDiv.classList.add('vr-error');
                customVRBtn.disabled = true;
                customVRBtn.style.opacity = '0.5';
                customVRBtn.title = 'Ваш браузер не поддерживает WebXR';
                return false;
            }
            
            try {
                const supported = await navigator.xr.isSessionSupported('immersive-vr');
                if (supported) {
                    vrStatusDiv.innerHTML = '✅ VR готов';
                    vrStatusDiv.style.color = '#aaffaa';
                    customVRBtn.disabled = false;
                    customVRBtn.style.opacity = '1';
                    return true;
                } else {
                    vrStatusDiv.innerHTML = '⚠️ VR режим недоступен (нет гарнитуры)';
                    vrStatusDiv.style.color = '#ffaa66';
                    customVRBtn.disabled = false; // кнопка активна, но при клике покажет ошибку
                    return false;
                }
            } catch (err) {
                vrStatusDiv.innerHTML = '⚠️ Ошибка WebXR';
                vrStatusDiv.classList.add('vr-error');
                customVRBtn.disabled = true;
                return false;
            }
        }
        
        // Функция входа в VR
        async function enterVR() {
            if (!('xr' in navigator)) {
                vrStatusDiv.innerHTML = '❌ WebXR не поддерживается';
                alert('Ваш браузер не поддерживает технологию WebXR. Используйте Chrome / Edge на Android или гарнитуру VR.');
                return;
            }
            
            try {
                // Проверка поддержки сессии
                const supported = await navigator.xr.isSessionSupported('immersive-vr');
                if (!supported) {
                    vrStatusDiv.innerHTML = '❌ VR сессия не поддерживается';
                    alert('VR-режим недоступен на этом устройстве. Нужна гарнитура VR или совместимый смартфон (Android + Chrome).');
                    return;
                }
                
                // Если уже в VR, выходим
                if (renderer.xr.isPresenting) {
                    const session = renderer.xr.getSession();
                    if (session) await session.end();
                    vrStatusDiv.innerHTML = '✅ VR готов';
                    customVRBtn.textContent = '🥽 Войти в VR';
                    return;
                }
                
                // Запрос сессии
                const session = await navigator.xr.requestSession('immersive-vr', {
                    optionalFeatures: ['local-floor', 'bounded-floor']
                });
                await renderer.xr.setSession(session);
                vrStatusDiv.innerHTML = '🥽 В VR режиме';
                customVRBtn.textContent = '🚪 Выйти из VR';
                
                // Обработка окончания сессии
                session.addEventListener('end', () => {
                    vrStatusDiv.innerHTML = '✅ VR готов';
                    customVRBtn.textContent = '🥽 Войти в VR';
                    // Сброс FOV камеры после выхода (опционально)
                    camera.fov = currentFOV;
                    camera.updateProjectionMatrix();
                });
                
            } catch (err) {
                console.error('Ошибка входа в VR:', err);
                vrStatusDiv.innerHTML = '❌ Ошибка входа в VR';
                vrStatusDiv.classList.add('vr-error');
                alert('Не удалось войти в VR режим. Убедитесь, что у вас есть VR-гарнитура или Cardboard, и сайт открыт по HTTPS.');
                setTimeout(() => {
                    if (vrStatusDiv.innerHTML.includes('Ошибка')) {
                        vrStatusDiv.innerHTML = '⚠️ VR не готов';
                    }
                }, 2000);
            }
        }
        
        // Функция выхода из VR (вызывается при клике если уже внутри)
        async function exitVR() {
            if (renderer.xr.isPresenting) {
                const session = renderer.xr.getSession();
                if (session) await session.end();
            }
        }
        
        // Обработчик кастомной кнопки VR
        customVRBtn.addEventListener('click', async () => {
            if (renderer.xr.isPresenting) {
                await exitVR();
                vrStatusDiv.innerHTML = '✅ VR готов';
                customVRBtn.textContent = '🥽 Войти в VR';
            } else {
                await enterVR();
            }
        });
        
        // Первоначальная проверка статуса VR
        updateVRStatus();
        
        // Дополнительно: если пользователь вышел через системную кнопку, нужно обновить текст кнопки
        renderer.xr.addEventListener('sessionend', () => {
            vrStatusDiv.innerHTML = '✅ VR готов';
            customVRBtn.textContent = '🥽 Войти в VR';
            // Восстановим нормальный FOV при выходе из VR
            camera.fov = currentFOV;
            camera.updateProjectionMatrix();
        });
        
        renderer.xr.addEventListener('sessionstart', () => {
            vrStatusDiv.innerHTML = '🥽 В VR режиме';
            customVRBtn.textContent = '🚪 Выйти из VR';
            // В VR тоже сохраняем текущий FOV, но управление через шлем работает отдельно
        });
        
        // --- Адаптация под изменение размера окна ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // --- Сброс FOV к стандартному при переключении сцен (необязательно, но приятно) ---
        // При смене панорамы возвращаем угол обзора к комфортному значению (70), но не сбрасываем сильно.
        // Чтобы сохранить впечатления, но пользователь может сам отрегулировать. Сделаем деликатно:
        function resetFOVonSceneChange() {
            if (!renderer.xr.isPresenting) {
                camera.fov = 70;
                camera.updateProjectionMatrix();
                currentFOV = 70;
            }
        }
        
        // Переопределим loadPanorama с небольшим сбросом после загрузки (необязательно)
        const originalLoader = loadPanorama;
        window.loadPanorama = loadPanorama; // не ломаем
        
        // Добавим сброс FOV при клике на кнопки сцен для удобства (зум сбрасывается)
        btnStreet.addEventListener('click', () => {
            if (!renderer.xr.isPresenting) {
                camera.fov = 70;
                camera.updateProjectionMatrix();
            }
        });
        btnRoom.addEventListener('click', () => {
            if (!renderer.xr.isPresenting) {
                camera.fov = 70;
                camera.updateProjectionMatrix();
            }
        });
        
        // --- Анимационный цикл ---
        function animate() {
            if (!renderer.xr.isPresenting) {
                controls.update(); // обновляем вращение камеры от мыши (только вращение)
            }
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        
        animate();
        
        // Небольшой лог в консоль для уверенности
        console.log('✅ Панорама готова! Приближение через колесико (усиленное в 5x). VR кнопка и статус — справа сверху.');
        
        // Дополнительно: если папка img отсутствует или фото не загружены, подскажем через консоль
        setTimeout(() => {
            if (!sphere.material || !sphere.material.map) {
                console.warn('⚠️ Убедитесь, что папка "img" существует и содержит street.jpg и room.jpg');
            }
        }, 1000);
    </script>
</body>
</html>
