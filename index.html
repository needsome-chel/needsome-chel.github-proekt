<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR Панорама 360° - Улица / Комната</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* Убираем выделение на мобильных */
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #000;
            touch-action: none; /* Улучшает управление на тачскринах */
        }
        
        /* --- ВЫДВИЖНОЕ МЕНЮ СПРАВА --- */
        .menu-container {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            pointer-events: none;
        }
        
        /* Кнопка-триггер (панель) */
        .menu-trigger {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 136, 0, 0.6);
            border-right: none;
            border-radius: 30px 0 0 30px;
            padding: 14px 12px 14px 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
            box-shadow: -2px 2px 12px rgba(0,0,0,0.4);
        }
        
        .menu-trigger:hover {
            background: #ff8800;
            color: #1e2a3a;
            border-color: #ffaa44;
        }
        
        .menu-trigger:active {
            transform: scale(0.97);
        }
        
        .menu-icon {
            font-size: 22px;
        }
        
        .menu-text {
            font-size: 14px;
            letter-spacing: 1px;
        }
        
        /* Само выдвижное меню */
        .menu-panel {
            pointer-events: auto;
            background: rgba(20, 20, 30, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 24px 0 0 24px;
            border: 1px solid rgba(255, 136, 0, 0.5);
            border-right: none;
            margin-top: 12px;
            padding: 12px 8px 12px 16px;
            width: 190px;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: -4px 4px 20px rgba(0,0,0,0.5);
        }
        
        .menu-panel.open {
            transform: translateX(0);
        }
        
        .menu-title {
            color: #ffaa66;
            font-size: 14px;
            font-weight: bold;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: 1px;
        }
        
        .scene-option {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            margin-bottom: 10px;
            border-radius: 30px;
            color: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .scene-option:hover {
            background: #ff8800;
            color: #1e2a3a;
            transform: translateX(-4px);
        }
        
        .scene-option.active-opt {
            background: #ff8800;
            color: #1e2a3a;
            box-shadow: 0 0 8px rgba(255,136,0,0.5);
        }
        
        .opt-icon {
            font-size: 20px;
        }
        
        /* Кнопка VR (оставляем справа сверху, но не мешаем меню) */
        .vr-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 210;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            pointer-events: auto;
        }
        
        .vr-button {
            background: #5a2d8c;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 40px;
            border: none;
            color: white;
            cursor: pointer;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
            transition: 0.2s;
        }
        
        .vr-button:hover {
            background: #8a4fc9;
            transform: scale(1.02);
        }
        
        .vr-status {
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 500;
            color: #ddd;
            font-family: monospace;
            border-left: 3px solid #ff8800;
        }
        
        /* Подсказки (слева вверху) */
        .hint-box {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            padding: 8px 14px;
            border-radius: 28px;
            color: #f0f0f0;
            font-size: 12px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .hint-box span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        /* Адаптация для телефонов */
        @media (max-width: 700px) {
            .menu-panel {
                width: 170px;
                padding: 8px 6px 8px 12px;
            }
            .scene-option {
                padding: 8px 10px;
                font-size: 13px;
            }
            .menu-trigger {
                padding: 10px 8px 10px 14px;
            }
            .menu-text {
                display: none; /* на телефоне скрываем текст, оставляем иконку */
            }
            .menu-trigger {
                padding: 12px 10px;
            }
            .menu-icon {
                font-size: 24px;
            }
            .hint-box {
                font-size: 9px;
                top: 12px;
                left: 12px;
                padding: 5px 10px;
                gap: 6px;
            }
            .vr-panel {
                top: 12px;
                right: 12px;
            }
            .vr-button {
                padding: 6px 14px;
                font-size: 12px;
            }
            .vr-status {
                font-size: 9px;
                padding: 3px 8px;
            }
        }
        
        /* Для очень маленьких экранов ещё компактнее */
        @media (max-width: 480px) {
            .hint-box span:last-child {
                display: none; /* на узких телефонах прячем часть подсказки, но оставляем главное */
            }
            .hint-box span:first-child {
                font-size: 8px;
            }
        }
        
        /* Стиль ошибки VR */
        .vr-error {
            background: rgba(200, 60, 50, 0.85);
            color: white;
        }
        
        /* Отключаем выделение на кнопках */
        button {
            touch-action: manipulation;
        }
    </style>
</head>
<body>

    <!-- ВЫДВИЖНОЕ МЕНЮ СПРАВА -->
    <div class="menu-container">
        <div class="menu-trigger" id="menuTrigger">
            <span class="menu-icon">📁</span>
            <span class="menu-text">Выбор сцены</span>
        </div>
        <div class="menu-panel" id="menuPanel">
            <div class="menu-title">Панорамы 360°</div>
            <button class="scene-option active-opt" data-scene="street">
                <span class="opt-icon">🏙️</span> Улица
            </button>
            <button class="scene-option" data-scene="room">
                <span class="opt-icon">🏠</span> Комната
            </button>
        </div>
    </div>
    
    <!-- VR панель (справа сверху) -->
    <div class="vr-panel">
        <button id="customVRBtn" class="vr-button">🥽 VR режим</button>
        <div id="vrSupportStatus" class="vr-status">🕶️ Проверка VR...</div>
    </div>
    
    <!-- Подсказки управления (слева вверху) -->
    <div class="hint-box">
        <span>🖱️ Мышь / Палец: вращение</span>
        <span>🔍 Колесико / Жест: приближение</span>
    </div>

    <!-- Импорт Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // --- ИНИЦИАЛИЗАЦИЯ ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030318);
        
        // Камера: стандартный FOV, гибкий зум через FOV
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 0.1);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;   // VR режим
        document.body.appendChild(renderer.domElement);
        
        // --- Панорамная сфера ---
        const geometry = new THREE.SphereGeometry(500, 64, 64);
        const sphere = new THREE.Mesh(geometry);
        scene.add(sphere);
        
        // --- Загрузка текстур из папки img ---
        const textures = {
            street: 'img/street.jpg',
            room: 'img/room.jpg'
        };
        
        let currentSceneId = 'street';   // 'street' или 'room'
        
        function loadPanorama(imagePath) {
            const loader = new THREE.TextureLoader();
            loader.load(imagePath, 
                (texture) => {
                    texture.wrapS = THREE.RepeatWrapping;
                    const material = new THREE.MeshBasicMaterial({
                        map: texture,
                        side: THREE.BackSide
                    });
                    sphere.material = material;
                    console.log('✅ Загружена панорама:', imagePath);
                },
                undefined,
                (error) => {
                    console.error('❌ Ошибка:', imagePath, error);
                    // Запасной цвет (розовый — чтобы видеть ошибку)
                    const fallbackMat = new THREE.MeshBasicMaterial({ color: 0xff4488, side: THREE.BackSide });
                    sphere.material = fallbackMat;
                    alert(`Не удалось загрузить ${imagePath}\nПроверьте папку img/`);
                }
            );
        }
        
        // Стартовая загрузка
        loadPanorama(textures.street);
        
        // --- Управление: вращение мышью/пальцем + зум через FOV (усиленный) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = false;     // отключаем стандартный зум
        controls.enablePan = false;
        controls.rotateSpeed = 1.0;
        controls.target.set(0, 0, 0);
        
        // Настройки усиленного зума (приближение до ~5-6 раз)
        const MIN_FOV = 14;      // сильное приближение
        const MAX_FOV = 100;     // широкий угол
        camera.fov = 70;
        camera.updateProjectionMatrix();
        
        // Функция изменения зума
        function handleZoom(deltaY) {
            if (renderer.xr.isPresenting) return; // в VR не мешаем
            let delta = deltaY * 0.08;
            let newFOV = camera.fov + delta;
            newFOV = Math.min(MAX_FOV, Math.max(MIN_FOV, newFOV));
            if (newFOV !== camera.fov) {
                camera.fov = newFOV;
                camera.updateProjectionMatrix();
            }
        }
        
        // Поддержка колесика мыши
        window.addEventListener('wheel', (e) => {
            if (!renderer.xr.isPresenting) {
                handleZoom(e.deltaY);
                e.preventDefault();
            }
        }, { passive: false });
        
        // Для телефонов: поддержка pinch-to-zoom через определение жестов (двумя пальцами)
        let initialPinchDistance = 0;
        let initialFOV = camera.fov;
        
        function getPinchDistance(touches) {
            if (touches.length < 2) return 0;
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }
        
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2 && !renderer.xr.isPresenting) {
                initialPinchDistance = getPinchDistance(e.touches);
                initialFOV = camera.fov;
                e.preventDefault();
            }
        });
        
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDistance > 0 && !renderer.xr.isPresenting) {
                const newDistance = getPinchDistance(e.touches);
                const scale = newDistance / initialPinchDistance;
                // Изменяем FOV: сжатие пальцев -> уменьшение FOV (приближение)
                let newFOV = initialFOV / scale;
                newFOV = Math.min(MAX_FOV, Math.max(MIN_FOV, newFOV));
                camera.fov = newFOV;
                camera.updateProjectionMatrix();
                e.preventDefault();
            }
        }, { passive: false });
        
        window.addEventListener('touchend', (e) => {
            initialPinchDistance = 0;
        });
        
        // --- ВЫДВИЖНОЕ МЕНЮ (логика открытия/закрытия) ---
        const menuTrigger = document.getElementById('menuTrigger');
        const menuPanel = document.getElementById('menuPanel');
        const sceneOptions = document.querySelectorAll('.scene-option');
        
        function toggleMenu() {
            menuPanel.classList.toggle('open');
        }
        
        function closeMenu() {
            menuPanel.classList.remove('open');
        }
        
        menuTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMenu();
        });
        
        // Клик вне меню -> закрыть (на документа)
        document.addEventListener('click', (e) => {
            // Если клик не по триггеру и не внутри панели
            if (!menuTrigger.contains(e.target) && !menuPanel.contains(e.target)) {
                closeMenu();
            }
        });
        
        // Обработка выбора сцены из меню
        sceneOptions.forEach(option => {
            option.addEventListener('click', (e) => {
                const sceneId = option.getAttribute('data-scene');
                if (sceneId === currentSceneId) {
                    closeMenu();
                    return;
                }
                // Обновляем активную кнопку в меню
                sceneOptions.forEach(opt => opt.classList.remove('active-opt'));
                option.classList.add('active-opt');
                
                // Загружаем новую панораму
                if (sceneId === 'street') {
                    currentSceneId = 'street';
                    loadPanorama(textures.street);
                } else if (sceneId === 'room') {
                    currentSceneId = 'room';
                    loadPanorama(textures.room);
                }
                
                // При переключении панорамы сбрасываем угол обзора до комфортного (70)
                if (!renderer.xr.isPresenting) {
                    camera.fov = 70;
                    camera.updateProjectionMatrix();
                }
                closeMenu();
            });
        });
        
        // --- VR ЛОГИКА (кастомная кнопка и статус) ---
        const customVRBtn = document.getElementById('customVRBtn');
        const vrStatusDiv = document.getElementById('vrSupportStatus');
        
        async function updateVRStatus() {
            if (!('xr' in navigator)) {
                vrStatusDiv.innerHTML = '❌ VR не поддерживается';
                vrStatusDiv.classList.add('vr-error');
                customVRBtn.disabled = true;
                customVRBtn.style.opacity = '0.5';
                return false;
            }
            try {
                const supported = await navigator.xr.isSessionSupported('immersive-vr');
                if (supported) {
                    vrStatusDiv.innerHTML = '✅ VR готов';
                    vrStatusDiv.style.color = '#aaffaa';
                    customVRBtn.disabled = false;
                    customVRBtn.style.opacity = '1';
                    return true;
                } else {
                    vrStatusDiv.innerHTML = '⚠️ Нет VR гарнитуры';
                    vrStatusDiv.style.color = '#ffaa66';
                    customVRBtn.disabled = false;
                    return false;
                }
            } catch(err) {
                vrStatusDiv.innerHTML = '⚠️ Ошибка WebXR';
                vrStatusDiv.classList.add('vr-error');
                customVRBtn.disabled = true;
                return false;
            }
        }
        
        async function enterVR() {
            if (!('xr' in navigator)) {
                alert('Ваш браузер не поддерживает WebXR. Используйте Chrome/Edge на Android.');
                return;
            }
            try {
                const supported = await navigator.xr.isSessionSupported('immersive-vr');
                if (!supported) {
                    alert('VR режим недоступен. Нужна совместимая гарнитура или Cardboard.');
                    return;
                }
                if (renderer.xr.isPresenting) {
                    const session = renderer.xr.getSession();
                    if (session) await session.end();
                    return;
                }
                const session = await navigator.xr.requestSession('immersive-vr', {
                    optionalFeatures: ['local-floor']
                });
                await renderer.xr.setSession(session);
                vrStatusDiv.innerHTML = '🥽 В VR режиме';
                customVRBtn.textContent = '🚪 Выйти из VR';
                
                session.addEventListener('end', () => {
                    vrStatusDiv.innerHTML = '✅ VR готов';
                    customVRBtn.textContent = '🥽 VR режим';
                    // Восстановить FOV при выходе
                    camera.fov = 70;
                    camera.updateProjectionMatrix();
                });
            } catch (err) {
                console.error(err);
                vrStatusDiv.innerHTML = '❌ Ошибка входа';
                alert('Не удалось войти в VR. Убедитесь, что сайт открыт по HTTPS.');
            }
        }
        
        customVRBtn.addEventListener('click', async () => {
            if (renderer.xr.isPresenting) {
                const session = renderer.xr.getSession();
                if (session) await session.end();
                vrStatusDiv.innerHTML = '✅ VR готов';
                customVRBtn.textContent = '🥽 VR режим';
            } else {
                await enterVR();
            }
        });
        
        renderer.xr.addEventListener('sessionstart', () => {
            vrStatusDiv.innerHTML = '🥽 В VR режиме';
            customVRBtn.textContent = '🚪 Выйти из VR';
        });
        
        renderer.xr.addEventListener('sessionend', () => {
            vrStatusDiv.innerHTML = '✅ VR готов';
            customVRBtn.textContent = '🥽 VR режим';
            camera.fov = 70;
            camera.updateProjectionMatrix();
        });
        
        updateVRStatus();
        
        // --- Адаптация под resize ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // --- Анимационный цикл ---
        function animate() {
            if (!renderer.xr.isPresenting) {
                controls.update();  // вращение от мыши/пальца
            }
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();
        
        // Небольшая помощь: если мобильное устройство, напомним про жест
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (isMobile) {
            const hintDiv = document.querySelector('.hint-box');
            if (hintDiv) {
                // Добавляем подсказку про два пальца, но оставляем кратко
                hintDiv.innerHTML = `<span>🖐️ Вращай пальцем</span><span>🤏 Сведи/разведи для зума</span>`;
            }
        }
        
        console.log('✅ Сайт готов: выдвижное меню справа, VR режим, зум в 5x, поддержка телефонов');
    </script>
</body>
</html>
