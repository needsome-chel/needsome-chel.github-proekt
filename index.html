<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR Панорама 360° | Свои фото (панорамы и обычные)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #000;
            touch-action: none;
        }
        
        /* ВЫДВИЖНОЕ МЕНЮ СПРАВА */
        .menu-container {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            pointer-events: none;
        }
        
        .menu-trigger {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 136, 0, 0.8);
            border-right: none;
            border-radius: 30px 0 0 30px;
            padding: 14px 12px 14px 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: -2px 2px 12px rgba(0,0,0,0.4);
        }
        
        .menu-trigger:active { transform: scale(0.97); background: #ff8800; color: #1e2a3a; }
        .menu-icon { font-size: 22px; }
        .menu-text { font-size: 14px; letter-spacing: 1px; }
        
        .menu-panel {
            pointer-events: auto;
            background: rgba(20, 20, 30, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px 0 0 24px;
            border: 1px solid rgba(255, 136, 0, 0.5);
            border-right: none;
            margin-top: 12px;
            padding: 12px 8px 12px 16px;
            width: 240px;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: -4px 4px 20px rgba(0,0,0,0.5);
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .menu-panel.open { transform: translateX(0); }
        .menu-panel::-webkit-scrollbar { width: 4px; }
        .menu-panel::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 4px; }
        .menu-panel::-webkit-scrollbar-thumb { background: #ff8800; border-radius: 4px; }
        
        .menu-title {
            color: #ffaa66;
            font-size: 14px;
            font-weight: bold;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 12px;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .add-photo-btn {
            background: #ff8800;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            color: #1e2a3a;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .add-photo-btn:hover, .add-photo-btn:active { transform: scale(1.05); background: #ffaa44; }
        
        .scene-option {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 30px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            word-break: break-word;
        }
        
        .scene-option:hover, .scene-option:active { background: #ff8800; color: #1e2a3a; transform: translateX(-4px); }
        .scene-option.active-opt { background: #ff8800; color: #1e2a3a; box-shadow: 0 0 8px rgba(255,136,0,0.5); }
        .opt-icon { font-size: 18px; flex-shrink: 0; }
        .opt-name { flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .photo-badge {
            font-size: 10px;
            background: rgba(0,0,0,0.5);
            padding: 2px 6px;
            border-radius: 12px;
            margin-left: 6px;
            flex-shrink: 0;
        }
        
        .delete-custom {
            background: rgba(255,80,80,0.7);
            border: none;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 11px;
            color: white;
            cursor: pointer;
            margin-left: 6px;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .delete-custom:hover, .delete-custom:active { background: #ff3333; transform: scale(1.02); }
        
        #fileInput { display: none; }
        
        /* VR панель */
        .vr-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 210;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            pointer-events: auto;
        }
        
        .vr-button {
            background: #5a2d8c;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 40px;
            border: none;
            color: white;
            cursor: pointer;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
            transition: 0.2s;
        }
        .vr-button:active { transform: scale(0.97); background: #8a4fc9; }
        
        .vr-status {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 500;
            color: #ddd;
            font-family: monospace;
            border-left: 3px solid #ff8800;
            max-width: 200px;
            text-align: right;
        }
        
        .hint-box {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            padding: 8px 14px;
            border-radius: 28px;
            color: #f0f0f0;
            font-size: 11px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .vr-gyro-hint {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 300;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .vr-gyro-hint div {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            display: inline-block;
            padding: 12px 24px;
            border-radius: 60px;
            color: #ffaa66;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid #ff8800;
        }
        .vr-gyro-hint .arrow-icon {
            font-size: 28px;
            display: inline-block;
            animation: wobble 1.5s infinite ease;
        }
        @keyframes wobble {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(15deg); }
            75% { transform: rotate(-15deg); }
        }
        
        /* Плоский режим для обычных фото (не панорам) */
        .flat-mode {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 50;
            pointer-events: none;
        }
        .flat-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        
        @media (max-width: 700px) {
            .menu-panel { width: 210px; padding: 8px 6px 8px 12px; max-height: 70vh; }
            .scene-option { padding: 8px 10px; font-size: 11px; }
            .menu-trigger { padding: 10px 8px 10px 14px; }
            .menu-text { display: none; }
            .menu-icon { font-size: 24px; }
            .hint-box { font-size: 9px; top: 12px; left: 12px; padding: 5px 10px; gap: 6px; }
            .vr-panel { top: 12px; right: 12px; }
            .vr-button { padding: 6px 14px; font-size: 12px; }
            .vr-status { font-size: 9px; padding: 3px 8px; max-width: 150px; }
            .vr-gyro-hint div { padding: 8px 16px; font-size: 13px; }
        }
        
        .vr-error { background: rgba(200, 60, 50, 0.85); color: white; }
        button { touch-action: manipulation; }
        .loading-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #ffaa66;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            z-index: 400;
            white-space: nowrap;
            backdrop-filter: blur(8px);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <div class="menu-trigger" id="menuTrigger">
            <span class="menu-icon">📁</span>
            <span class="menu-text">Сцены</span>
        </div>
        <div class="menu-panel" id="menuPanel">
            <div class="menu-title">
                <span>Панорамы</span>
                <button id="addPhotoBtn" class="add-photo-btn" title="Загрузить фото (панорама или обычное)">+</button>
            </div>
            <div id="sceneList"></div>
            <div id="customScenesList"></div>
        </div>
    </div>
    
    <input type="file" id="fileInput" accept="image/jpeg,image/jpg,image/png,image/webp">
    
    <div class="vr-panel">
        <button id="customVRBtn" class="vr-button">🥽 VR режим</button>
        <div id="vrSupportStatus" class="vr-status">🕶️ Проверка VR...</div>
    </div>
    
    <div class="hint-box" id="hintBox">
        <span>🖱️ Мышь: вращение</span>
        <span>🔍 Колесико: приближение</span>
        <span>➕ Своё фото</span>
    </div>
    
    <div id="vrGyroHint" class="vr-gyro-hint" style="display: none;">
        <div>
            <span class="arrow-icon">🔄</span> ПОВОРАЧИВАЙ ТЕЛЕФОН <span class="arrow-icon">📱</span><br>
            <span style="font-size: 12px;">наклоняй и крути устройство</span>
        </div>
    </div>

    <!-- Элемент для отображения обычных фото (плоский режим) -->
    <div id="flatModeContainer" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 60; display: none; align-items: center; justify-content: center;">
        <img id="flatImage" style="max-width: 100%; max-height: 100%; object-fit: contain;" alt="Обычное фото">
        <div style="position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; background: rgba(0,0,0,0.6); color: white; padding: 6px; font-size: 12px;">
            📷 Обычное фото (не панорама) | Используйте мышь/палец для перемещения
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // --- ОПРЕДЕЛЕНИЕ МОБИЛЬНОГО УСТРОЙСТВА ---
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const isPhone = isMobile && !/iPad|Android(?!.*Mobile)/i.test(navigator.userAgent);
        
        // --- ИНИЦИАЛИЗАЦИЯ Three.js ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030318);
        
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 0.1);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // --- Панорамная сфера ---
        const geometry = new THREE.SphereGeometry(500, 64, 64);
        const sphere = new THREE.Mesh(geometry);
        scene.add(sphere);
        
        // Элементы для плоского режима
        const flatModeContainer = document.getElementById('flatModeContainer');
        const flatImage = document.getElementById('flatImage');
        
        // --- Управление: OrbitControls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = false;
        controls.enablePan = false;
        controls.rotateSpeed = 1.0;
        controls.target.set(0, 0, 0);
        
        // --- Настройка зума через FOV ---
        const MIN_FOV = 14;
        const MAX_FOV = 100;
        camera.fov = 70;
        camera.updateProjectionMatrix();
        
        function handleZoom(deltaY) {
            if (isVRmodeActive) return;
            let delta = deltaY * 0.08;
            let newFOV = camera.fov + delta;
            newFOV = Math.min(MAX_FOV, Math.max(MIN_FOV, newFOV));
            if (newFOV !== camera.fov) {
                camera.fov = newFOV;
                camera.updateProjectionMatrix();
            }
        }
        
        window.addEventListener('wheel', (e) => {
            if (!isVRmodeActive && !renderer.xr.isPresenting && !isFlatModeActive) {
                handleZoom(e.deltaY);
                e.preventDefault();
            }
        }, { passive: false });
        
        // Пинч-зум для телефонов
        let initialPinchDistance = 0;
        let initialFOV = camera.fov;
        function getPinchDistance(touches) {
            if (touches.length < 2) return 0;
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }
        
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2 && !isVRmodeActive && !renderer.xr.isPresenting && !isFlatModeActive) {
                initialPinchDistance = getPinchDistance(e.touches);
                initialFOV = camera.fov;
                e.preventDefault();
            }
        });
        
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDistance > 0 && !isVRmodeActive && !renderer.xr.isPresenting && !isFlatModeActive) {
                const newDistance = getPinchDistance(e.touches);
                const scale = newDistance / initialPinchDistance;
                let newFOV = initialFOV / scale;
                newFOV = Math.min(MAX_FOV, Math.max(MIN_FOV, newFOV));
                camera.fov = newFOV;
                camera.updateProjectionMatrix();
                e.preventDefault();
            }
        }, { passive: false });
        
        window.addEventListener('touchend', () => { initialPinchDistance = 0; });
        
        // --- ОПРЕДЕЛЕНИЕ ПАНОРАМА ЭТО ИЛИ НЕТ (проверка соотношения сторон) ---
        // Панорама 360° обычно имеет соотношение 2:1 (ширина в 2 раза больше высоты)
        // Допуск: от 1.8 до 2.2 считается панорамой
        function isPanoramaImage(imgWidth, imgHeight) {
            const aspect = imgWidth / imgHeight;
            // Классическая панорама 360°: aspect ≈ 2.0
            // Также считаем панорамами изображения с aspect > 1.5 (широкие)
            return aspect >= 1.7 && aspect <= 2.4;
        }
        
        // Флаг плоского режима
        let isFlatModeActive = false;
        
        // Показ обычного фото (плоский режим)
        function showFlatImage(imageUrl) {
            isFlatModeActive = true;
            // Скрываем 3D сферу
            sphere.visible = false;
            // Показываем контейнер с плоским изображением
            flatImage.src = imageUrl;
            flatModeContainer.style.display = 'flex';
            // Отключаем вращение камеры в 3D (оставляем только для плоского режима не нужно)
            controls.enabled = false;
            // Для плоского режима не нужно вращение
        }
        
        // Показ панорамы (3D сфера)
        function showPanorama(imageUrl) {
            isFlatModeActive = false;
            flatModeContainer.style.display = 'none';
            sphere.visible = true;
            controls.enabled = true;
            
            // Загружаем текстуру на сферу
            const loader = new THREE.TextureLoader();
            loader.load(imageUrl, 
                (texture) => {
                    texture.wrapS = THREE.RepeatWrapping;
                    const material = new THREE.MeshBasicMaterial({
                        map: texture,
                        side: THREE.BackSide
                    });
                    sphere.material = material;
                    console.log('✅ Панорама загружена');
                    showToast('Панорама 360° загружена');
                },
                undefined,
                (error) => {
                    console.error('Ошибка загрузки панорамы:', error);
                    showToast('Ошибка загрузки панорамы');
                    const fallbackMat = new THREE.MeshBasicMaterial({ color: 0xff4488, side: THREE.BackSide });
                    sphere.material = fallbackMat;
                }
            );
        }
        
        // Умная загрузка изображения: определяем панорама или нет
        function loadImageSmart(fileOrUrl, isFile = true, fileObj = null) {
            showToast('Анализ изображения...');
            
            const processImage = (imgElement) => {
                const width = imgElement.width;
                const height = imgElement.height;
                const isPanorama = isPanoramaImage(width, height);
                
                console.log(`Размер: ${width}x${height}, соотношение: ${(width/height).toFixed(2)}, панорама: ${isPanorama}`);
                
                if (isPanorama) {
                    showToast('Обнаружена панорама 360°');
                    if (isFile && fileObj) {
                        const url = URL.createObjectURL(fileObj);
                        showPanorama(url);
                    } else {
                        showPanorama(fileOrUrl);
                    }
                } else {
                    showToast('Обычное фото (отображается в центре)');
                    if (isFile && fileObj) {
                        const url = URL.createObjectURL(fileObj);
                        showFlatImage(url);
                    } else {
                        showFlatImage(fileOrUrl);
                    }
                }
            };
            
            if (isFile && fileObj) {
                const url = URL.createObjectURL(fileObj);
                const img = new Image();
                img.onload = () => {
                    processImage(img);
                    URL.revokeObjectURL(url);
                };
                img.onerror = () => {
                    showToast('Ошибка загрузки изображения');
                    URL.revokeObjectURL(url);
                };
                img.src = url;
            } else {
                const img = new Image();
                img.onload = () => processImage(img);
                img.onerror = () => showToast('Ошибка загрузки изображения');
                img.src = fileOrUrl;
            }
        }
        
        // --- Управление сценами ---
        const defaultScenes = [
            { id: 'street', name: '🏙️ Улица', url: 'img/street.jpg', isCustom: false, isPanorama: true },
            { id: 'room', name: '🏠 Комната', url: 'img/room.jpg', isCustom: false, isPanorama: true }
        ];
        
        let customScenes = [];
        let currentSceneId = 'street';
        
        function loadCustomScenesFromStorage() {
            const saved = localStorage.getItem('panorama_custom_scenes_v2');
            if (saved) {
                try {
                    customScenes = JSON.parse(saved);
                } catch(e) { customScenes = []; }
            }
            renderSceneList();
        }
        
        function saveCustomScenes() {
            localStorage.setItem('panorama_custom_scenes_v2', JSON.stringify(customScenes));
            renderSceneList();
        }
        
        function switchToScene(sceneId, sceneUrl, sceneName, isCustom = false, isPanoramaFlag = true) {
            if (currentSceneId === sceneId && !isCustom) return;
            currentSceneId = sceneId;
            
            if (isPanoramaFlag) {
                showPanorama(sceneUrl);
            } else {
                showFlatImage(sceneUrl);
            }
            
            // Обновляем активный класс
            document.querySelectorAll('.scene-option').forEach(opt => {
                if (opt.getAttribute('data-scene-id') === sceneId) {
                    opt.classList.add('active-opt');
                } else {
                    opt.classList.remove('active-opt');
                }
            });
            
            // Сброс FOV
            if (!isVRmodeActive && !renderer.xr.isPresenting && isPanoramaFlag) {
                camera.fov = 70;
                camera.updateProjectionMatrix();
            }
        }
        
        function addCustomScene(file) {
            if (!file.type.startsWith('image/')) {
                alert('Пожалуйста, выберите изображение');
                return;
            }
            
            const tempUrl = URL.createObjectURL(file);
            const img = new Image();
            
            img.onload = () => {
                const width = img.width;
                const height = img.height;
                const isPan = isPanoramaImage(width, height);
                const aspect = width / height;
                
                const id = 'custom_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                const name = file.name.length > 25 ? file.name.substr(0, 22) + '...' : file.name;
                const displayName = isPan ? '🌐 ' + name : '🖼️ ' + name;
                
                customScenes.push({
                    id: id,
                    name: displayName,
                    url: tempUrl,
                    isCustom: true,
                    originalName: file.name,
                    isPanorama: isPan,
                    aspectRatio: aspect
                });
                
                saveCustomScenes();
                
                // Переключаемся на новую сцену
                if (isPan) {
                    showPanorama(tempUrl);
                } else {
                    showFlatImage(tempUrl);
                }
                currentSceneId = id;
                
                URL.revokeObjectURL(tempUrl);
            };
            
            img.onerror = () => {
                showToast('Ошибка чтения файла');
                URL.revokeObjectURL(tempUrl);
            };
            
            img.src = tempUrl;
        }
        
        function deleteCustomScene(sceneId) {
            const index = customScenes.findIndex(s => s.id === sceneId);
            if (index !== -1) {
                if (customScenes[index].url && customScenes[index].url.startsWith('blob:')) {
                    URL.revokeObjectURL(customScenes[index].url);
                }
                customScenes.splice(index, 1);
                saveCustomScenes();
                
                if (currentSceneId === sceneId) {
                    switchToScene('street', defaultScenes[0].url, defaultScenes[0].name, false, true);
                }
            }
        }
        
        function renderSceneList() {
            const sceneListDiv = document.getElementById('sceneList');
            const customListDiv = document.getElementById('customScenesList');
            
            sceneListDiv.innerHTML = '';
            defaultScenes.forEach(scene => {
                const btn = document.createElement('button');
                btn.className = 'scene-option';
